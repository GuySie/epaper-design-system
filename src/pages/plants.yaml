page: plants
description:
  shows: Soil moisture for up to 22 plants in two columns, the driest first if you like, with dry plants as warning or severe
    chips.
  needs_also:
  - Soil moisture sensors (e.g. from a plant monitor integration).
  trigger_advice: A time pattern every 15 minutes.
redraw: trigger
stale:
- plant_1
- plant_2
- plant_3
- plant_4
- plant_5
- plant_6
- plant_7
- plant_8
- plant_9
- plant_10
- plant_11
- plant_12
- plant_13
- plant_14
- plant_15
- plant_16
- plant_17
- plant_18
- plant_19
- plant_20
- plant_21
- plant_22
inputs:
- name: plant_1
  section: content
  label: Plant 1 - sensor
  help: Soil moisture sensor for plant 1.
  selector:
    entity:
      filter:
        domain: sensor
  required: true
- repeat:
    from: 2
    to: 22
    items:
    - name: plant_{n}
      section: content
      label: Plant {n} - sensor
      help: Soil moisture sensor for plant {n}. Leave blank to disable this row.
      selector:
        entity:
          filter:
            domain: sensor
      default: ''
- repeat:
    from: 1
    to: 22
    items:
    - name: plant_{n}_label
      section: content
      label: Plant {n} - label
      help: Optional label override. Leave blank to derive it from the sensor's name.
      selector:
        text: {}
      default: ''
- name: sort_driest_first
  section: content
  label: Sort driest first
  help: Order plants by moisture (driest at the top) instead of the configured order
  selector:
    boolean: {}
  default: false
- name: flag_moisture_low
  section: thresholds
  label: 'Dry soil: flag it'
  help: Off, a plant is never flagged, whatever the two values below say.
  selector:
    boolean: {}
  default: true
- name: warning_moisture_low
  section: thresholds
  label: 'Soil moisture: warning at or below'
  help: If a plant's moisture is at or below this percentage, its row is a warning chip.
  selector:
    number:
      min: 0
      max: 100
      unit_of_measurement: '%'
      mode: box
  default: 25
- name: severe_moisture_low
  section: thresholds
  label: 'Soil moisture: severe at or below'
  help: If a plant's moisture is at or below this percentage, its row is a severe chip.
  selector:
    number:
      min: 0
      max: 100
      unit_of_measurement: '%'
      mode: box
  default: 14
bind:
- flag_moisture_low
- severe_moisture_low
- repeat:
    from: 1
    to: 22
    items:
    - plant_{n}
    - plant_{n}_label
- warning_moisture_low
- sort_driest_first
data:
  variables:
  - plants: |
      {% set ns = namespace(list=[]) %} {% set slots = [
        {'entity': plant_1, 'label': plant_1_label},
        {'entity': plant_2, 'label': plant_2_label},
        {'entity': plant_3, 'label': plant_3_label},
        {'entity': plant_4, 'label': plant_4_label},
        {'entity': plant_5, 'label': plant_5_label},
        {'entity': plant_6, 'label': plant_6_label},
        {'entity': plant_7, 'label': plant_7_label},
        {'entity': plant_8, 'label': plant_8_label},
        {'entity': plant_9, 'label': plant_9_label},
        {'entity': plant_10, 'label': plant_10_label},
        {'entity': plant_11, 'label': plant_11_label},
        {'entity': plant_12, 'label': plant_12_label},
        {'entity': plant_13, 'label': plant_13_label},
        {'entity': plant_14, 'label': plant_14_label},
        {'entity': plant_15, 'label': plant_15_label},
        {'entity': plant_16, 'label': plant_16_label},
        {'entity': plant_17, 'label': plant_17_label},
        {'entity': plant_18, 'label': plant_18_label},
        {'entity': plant_19, 'label': plant_19_label},
        {'entity': plant_20, 'label': plant_20_label},
        {'entity': plant_21, 'label': plant_21_label},
        {'entity': plant_22, 'label': plant_22_label}
      ] %} {% for slot in slots %}
        {% if slot.entity and slot.entity != '' %}
          {% set raw_state = states(slot.entity) %}
          {% set has_value = raw_state not in ['unknown', 'unavailable', 'none', ''] %}
          {% set pct_raw = (raw_state | float(0)) if has_value else 0 %}
          {% set pct_raw = ([pct_raw, 0] | max) %}
          {% set pct_raw = ([pct_raw, 100] | min) %}
          {% set pct = pct_raw | round | int %}
          {% set fname = device_name(slot.entity) or entity_name(slot.entity) or slot.entity %}
          {% set fname_lower = fname | lower %}
          {% if slot.label and slot.label != '' %}
            {% set label_text = slot.label %}
          {% elif fname_lower.endswith(' soil moisture') %}
            {% set label_text = fname[:-14] %}
          {% elif fname_lower.endswith(' moisture') %}
            {% set label_text = fname[:-9] %}
          {% else %}
            {% set label_text = fname %}
          {% endif %}
          {% set ns.list = ns.list + [{
            'label': label_text,
            'pct': pct,
            'ok': has_value
          }] %}
        {% endif %}
      {% endfor %} {{ ns.list }}
  - include: default_title
  - ds_plants: |
      {% set ok = plants | selectattr('ok') | list %} {% set bad = plants | rejectattr('ok') | list %} {{ ((ok | sort(attribute='pct')) + bad) if sort_driest_first else plants }}
  draw:
    kind: choose
    when:
    - '{{ plants | length > 0 }}'
    steps: []

- name: warning_moisture_low
  section: thresholds
  label: Warning moisture threshold
  help: If a plant's moisture is at or below this percentage, its value is shown as a warning chip
  selector:
    number:
      min: 0
      max: 100
      unit_of_measurement: '%'
      mode: box
  default: 25
- name: severe_moisture_low
  section: thresholds
  label: Severe moisture threshold
  help: If a plant's moisture is at or below this percentage, its value is shown as severe
  selector:

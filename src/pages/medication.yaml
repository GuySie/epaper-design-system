page: medication
description:
  shows: 'A medication log on one or more buttons: press any of them after taking your medication, and every selected device
    shows the time and date of that press, so a glance answers "did I already take this?" wherever a device is. Nothing is drawn until a button has been pressed once,
    and while every button is offline the devices keep their last image.'
  trigger_advice: 'None to set: pick the devices and their buttons'' `event.*` entities. The page redraws every device on a press
    of any of the buttons, and by itself when the warning or severe time since the last press is reached.'
  notes:
  - A press flashes the LED of the device the pressed button is on, as soon as the press is registered, before the ~30 second
    redraw.
  - With several devices, a colour is used only where every device has it, so a black/white device next to a colour one makes
    both draw in black and white.
  - Both `button_down` and `button_up` count, because a sleeping device sometimes only delivers the release; one press still
    gives one redraw.
  title_default: '"Medication · Last taken"'
  times: the time of the press
redraw: button
inputs:
- name: flag_late
  section: thresholds
  label: 'Overdue: flag it'
  help: Off, the date never turns into a chip and the devices don't redraw at the two times below.
  selector:
    boolean: {}
  default: true
- name: warning_late
  section: thresholds
  label: 'Overdue: warning at'
  help: Hours since the last press at which the date turns into a warning chip. The devices redraw by themselves at that moment.
  selector:
    number:
      min: 0
      max: 168
      unit_of_measurement: h
      mode: box
  default: 24
- name: severe_late
  section: thresholds
  label: 'Overdue: severe at'
  help: Hours since the last press at which the date turns into a severe chip. The devices redraw by themselves at that moment.
  selector:
    number:
      min: 0
      max: 168
      unit_of_measurement: h
      mode: box
  default: 36
bind:
- flag_late
- warning_late
- severe_late
- button_entity: ds_btn
data:
  variables:
  # the newest press among the buttons that report one (design system: Medication, Several panels, one log)
  - ds_press_ts: '{% set t = expand(ds_btn) | map(attribute=''state'') | map(''as_timestamp'', none) | reject(''none'') | list %}{{ t | max if t else 0 }}'
  - header_title_display: '{{ header_title if header_title else (language_map[weekday_lang][''default_title''] ~ '' · '' ~
      language_map[weekday_lang][''last_taken'']) }}'
  - press_time_label: '{{ (ds_press_ts | float(0)) | timestamp_custom(''%-I:%M %p'') if time_format == ''12h'' else (ds_press_ts
      | float(0)) | timestamp_custom(''%H:%M'') }}'
  - ds_date: '{% set t = as_local(as_datetime(ds_press_ts | float(0))) %}{{ weekday_short_map[weekday_lang][t.weekday()] }}
      {{ t.day }} {{ months_short_map[weekday_lang][t.month - 1] }}'
  - ds_overdue_k: '{% set h = (as_timestamp(now()) - (ds_press_ts | float(0))) / 3600 %} {% set w, sv = warning_late | float(0),
      severe_late | float(0) %} {% set on = flag_late | default(true) %} {{ ''sev'' if (on and h >= sv) else (''warn'' if
      (on and h >= w) else '''') }}'
  steps:
  # no press, no redraw: the panel keeps the last press it shows (design system: Medication, No press, no redraw)
  - condition: template
    value_template: '{{ (ds_press_ts | float(0)) > 0 }}'
  draw:
    kind: single
  triggers:
  - trigger: template
    id: overdue
    value_template: '{% set t = expand(ds_btn_t) | map(attribute=''state'') | map(''as_timestamp'', none) | reject(''none'') | list %}{{ ds_flag_late and t | count > 0 and as_timestamp(now()) - (t | max) >= (ds_warn_h | float(0))
      * 3600 }}'
  - trigger: template
    id: overdue
    value_template: '{% set t = expand(ds_btn_t) | map(attribute=''state'') | map(''as_timestamp'', none) | reject(''none'') | list %}{{ ds_flag_late and t | count > 0 and as_timestamp(now()) - (t | max) >= (ds_sev_h | float(0))
      * 3600 }}'
  - trigger: homeassistant
    event: start
    id: redraw
  - trigger: state
    entity_id: !input 'button_entity'
    id: press
    not_from:
    - unavailable
    - unknown
    not_to:
    - unavailable
    - unknown
  trigger_variables:
    ds_btn_t: !input 'button_entity'
    ds_warn_h: !input 'warning_late'
    ds_sev_h: !input 'severe_late'
    ds_flag_late: !input 'flag_late'
texts:
  en:
    overdue: Overdue
    missed: Missed
    default_title: Medication
    last_taken: Last taken
  de:
    overdue: Überfällig
    missed: Verpasst
    default_title: Medikament
    last_taken: Zuletzt genommen
  nl:
    overdue: Te laat
    missed: Gemist
    default_title: Medicatie
    last_taken: Laatst ingenomen
  fr:
    overdue: En retard
    missed: Oublié
    default_title: Médicament
    last_taken: Dernière prise
  es:
    overdue: Atrasado
    missed: Olvidado
    default_title: Medicación
    last_taken: Última toma
  pl:
    overdue: Spóźnione
    missed: Pominięte
    default_title: Lek
    last_taken: Ostatnio przyjęte
  hr:
    overdue: Kasni
    missed: Propušteno
    default_title: Lijek
    last_taken: Zadnje uzeto
  sv:
    overdue: Försenad
    missed: Missad
    default_title: Medicin
    last_taken: Senast tagen
layouts:
  27l:
    spec: medication_27l
    notes:
    - 'Button devices sold as 2.9": configure the firmware for 168 x 384, or the top 16 px are cut off.'
thresholds:
- data: "Hours since the last press"
  what: "late"
  at: "≥"
footer: "none (Glance)"

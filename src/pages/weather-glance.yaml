page: weather-glance
description:
  shows: 'The weather at a glance: the temperature large, with the condition icon, and one more reading under it.'
  needs:
  - weather
  optional:
  - sun
  - moon
  - kleenex_pollen
  trigger_advice: A time pattern every 15 or 30 minutes.
  notes:
  based_on:
  - name: Weatherman blueprint by Chunkysteveo
    url: https://github.com/chunkysteveo/OpenEPaperLink-HA-Weatherman/
  title_default: '"Weather"'
redraw: trigger
stale: drawing
inputs:
- include: weather_sources
- include: weather_thresholds
bind:
- weather_entity
ds_in: true
data:
  variables:
  - include: weather_forecast_entity
  steps:
  - if:
    - '{{ forecast_entity != ''unavailable'' }}'
    then:
    - action: weather.get_forecasts
      target:
        entity_id: '{{ forecast_entity }}'
      data:
        type: daily
      response_variable: ds_fd
    - if:
      - '{{ (state_attr(forecast_entity, ''supported_features'') | int(0)) | bitwise_and(2) > 0 }}'
      then:
      - action: weather.get_forecasts
        target:
          entity_id: '{{ forecast_entity }}'
        data:
          type: hourly
        response_variable: ds_fh
  draw:
    kind: weather
layouts:
  '14':
    spec: weather_glance_14
    defaults:
      rotate: '0'
  '35':
    spec: weather_glance_35
    inputs:
    - name: moon_phase_sensor
      section: content
      label: Moon phase sensor
      help: Sensor used for the moon phase badge on the weather icon. Leave blank to detect the Moon integration's sensor
        automatically (its entity ID is translated, so it isn't always `sensor.moon_phase`). Set this to use a different sensor,
        such as the Lunar Phase integration's "Moon Phase" sensor. No Moon sensor means no badge.
      selector:
        entity:
          domain: sensor
      default: ''

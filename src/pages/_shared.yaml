# groups: what several page definitions share, written once. A page names one with `include: <group>`: as an item of a
# list (the group's items take its place) or as a key of a mapping (the group's keys take its place). lib/pages.py resolves them.
groups:
  weather_entity:
  - name: weather_entity
    section: content
    label: Weather entity
    help: The weather entity to show. While it isn't working, another working weather entity is used instead.
    selector:
      entity:
        filter:
          domain: weather
    required: true
  weather_sources:
  - include: weather_entity
  - name: current_temp_sensor
    section: content
    label: Current temperature sensor
    help: Optional temperature sensor to use instead of forecast temperature
    selector:
      entity:
        filter:
          domain: sensor
          device_class: temperature
    default: ''
  - name: pollen_sensor
    section: content
    label: Pollen forecast sensor
    help: Optional Kleenex pollen sensor. Left empty, the screen shows no pollen.
    selector:
      entity:
        filter:
          domain: sensor
    default: ''
  - name: moon_phase_sensor
    section: content
    label: Moon phase sensor
    help: Sensor used for the moon phase icon. Leave blank to detect the Moon integration's sensor automatically (its entity
      ID is translated, so it isn't always `sensor.moon_phase`). Set this to use a different sensor, such as the Lunar Phase
      integration's "Moon Phase" sensor.
    selector:
      entity:
        domain: sensor
    default: ''
  - name: weather_warning_sensor
    section: content
    label: Weather warning level sensor (optional)
    help: A sensor with the official warning level for your area (KNMI's "Warning level", Meteoalarm, ...). Code yellow (or
      minor/moderate) shows as a warning chip, orange and red (severe/extreme) as a severe chip, ahead of every other alert
      on the display.
    selector:
      entity:
        filter:
          domain: sensor
    default: ''
  - name: weather_warning_text_sensor
    section: content
    label: Weather warning text sensor (optional)
    help: A sensor that lists the active warnings (KNMI's "Warnings"), so the chip can name the warning (e.g. thunderstorms).
      Without it the chip shows the colour code.
    selector:
      entity:
        filter:
          domain: sensor
    default: ''
  - name: pollen_type
    section: content
    label: Pollen type
    help: Optional type of pollen to track (as listed in the Kleenex data) - if not specified will default to the total pollen
      count
    selector:
      text: null
    default: ''
  rain_chart_thresholds:
  - name: flag_rain_hour
    section: thresholds
    label: 'Rain per hour: flag it'
    help: Off, no bar is flagged and the chart shows no threshold lines, whatever the two values below say.
    selector:
      boolean: {}
    default: true
  - name: warning_rain_hour
    section: thresholds
    label: 'Rain per hour: warning at or above'
    help: A bar at or above this is a warning. The chart marks the value with the lower dashed line.
    selector:
      number:
        min: 0
        step: 0.1
        unit_of_measurement: mm/h
        mode: box
    default: 2.5
  - name: severe_rain_hour
    section: thresholds
    label: 'Rain per hour: severe at or above'
    help: If a timeframe's combined rain intensity is at or above this value, its bar switches to the severe colour. The graph
      uses a log scale up to 50 mm/h (violent rain).
    selector:
      number:
        min: 0
        step: 0.1
        unit_of_measurement: mm/h
        mode: box
    default: 10
  rain_chart_texts:
  - ds_txt: |
      {% set m = {
        "en": {"title": "Rain", "dry": "Dry until", "rain": "Rain", "heavy": "Heavy rain", "peak": "peak", "unit": "mm/h"},
        "de": {"title": "Regen", "dry": "Trocken bis", "rain": "Regen", "heavy": "Starkregen", "peak": "Spitze", "unit": "mm/h"},
        "nl": {"title": "Regen", "dry": "Droog tot", "rain": "Regen", "heavy": "Zware bui", "peak": "piek", "unit": "mm/h"},
        "fr": {"title": "Pluie", "dry": "Sec jusqu'à", "rain": "Pluie", "heavy": "Forte pluie", "peak": "pic", "unit": "mm/h"},
        "es": {"title": "Lluvia", "dry": "Seco hasta", "rain": "Lluvia", "heavy": "Lluvia fuerte", "peak": "pico", "unit": "mm/h"},
        "pl": {"title": "Deszcz", "dry": "Sucho do", "rain": "Deszcz", "heavy": "Ulewa", "peak": "szczyt", "unit": "mm/h"},
        "hr": {"title": "Kiša", "dry": "Suho do", "rain": "Kiša", "heavy": "Jaka kiša", "peak": "vrh", "unit": "mm/h"},
        "sv": {"title": "Regn", "dry": "Torrt till", "rain": "Regn", "heavy": "Skyfall", "peak": "topp", "unit": "mm/h"}
      } %} {{ m[weekday_lang] }}
  - ds_title: '{{ header_title if header_title else ds_txt[''title''] }}'
  weather_threshold_rows:
  - data: "Cold (`*_temp_low`)"
    what: "temp_low"
    at: "≤"
  - data: "Heat (`*_temp_high`)"
    what: "temp_high"
    at: "≥"
  - data: "Wind, in the weather entity's own wind unit; the defaults suit km/h (`*_wind_high`)"
    what: "wind_high"
    at: "≥"
  - data: "Rain per hour (`*_rain_hour`)"
    what: "rain_hour"
    at: "≥"
  - data: "Rain per day, today's total included (`*_rain_day`)"
    what: "rain_day"
    at: "≥"
  - data: "Pollen (`*_pollen_high`, where a pollen sensor is an input)"
    warning: "sensor level *high*"
    severe: "sensor level *very high*"
  - data: "Condition (`*_conditions`, a list)"
    what: "conditions"
  rain_threshold_rows:
  - data: "Rain per hour"
    what: "rain_hour"
    at: "≥"
  weather_thresholds:
  - name: flag_temp_low
    section: thresholds
    label: 'Cold: flag it'
    help: Off, cold is never flagged, whatever the two values below say.
    selector:
      boolean: {}
    default: true
  - name: warning_temp_low
    section: thresholds
    label: 'Cold: warning at or below'
    help: Temperatures at or below this get a warning chip.
    selector:
      number:
        unit_of_measurement: °
        mode: box
    default: 3
  - name: severe_temp_low
    section: thresholds
    label: 'Cold: severe at or below'
    help: Temperatures at or below this get a severe chip.
    selector:
      number:
        unit_of_measurement: °
        mode: box
    default: 0
  - name: flag_temp_high
    section: thresholds
    label: 'Heat: flag it'
    help: Off, heat is never flagged, whatever the two values below say.
    selector:
      boolean: {}
    default: true
  - name: warning_temp_high
    section: thresholds
    label: 'Heat: warning at or above'
    help: Temperatures at or above this get a warning chip.
    selector:
      number:
        unit_of_measurement: °
        mode: box
    default: 27
  - name: severe_temp_high
    section: thresholds
    label: 'Heat: severe at or above'
    help: Temperatures at or above this get a severe chip.
    selector:
      number:
        unit_of_measurement: °
        mode: box
    default: 35
  - name: flag_wind_high
    section: thresholds
    label: 'Wind: flag it'
    help: Off, wind is never flagged, whatever the two values below say.
    selector:
      boolean: {}
    default: true
  - name: warning_wind_high
    section: thresholds
    label: 'Wind: warning at or above'
    help: Wind speeds at or above this get a warning chip. In the weather entity's own wind unit; the default suits km/h.
    selector:
      number:
        mode: box
    default: 50
  - name: severe_wind_high
    section: thresholds
    label: 'Wind: severe at or above'
    help: Wind speeds at or above this get a severe chip. In the weather entity's own wind unit; the default suits km/h.
    selector:
      number:
        mode: box
    default: 75
  - name: flag_rain_hour
    section: thresholds
    label: 'Rain per hour: flag it'
    help: Off, rain per hour is never flagged, whatever the two values below say.
    selector:
      boolean: {}
    default: true
  - name: warning_rain_hour
    section: thresholds
    label: 'Rain per hour: warning at or above'
    help: Hourly forecast rain at or above this gets a warning chip.
    selector:
      number:
        min: 0
        step: 0.1
        unit_of_measurement: mm/h
        mode: box
    default: 2.5
  - name: severe_rain_hour
    section: thresholds
    label: 'Rain per hour: severe at or above'
    help: Hourly forecast rain at or above this gets a severe chip.
    selector:
      number:
        min: 0
        step: 0.1
        unit_of_measurement: mm/h
        mode: box
    default: 10
  - name: flag_rain_day
    section: thresholds
    label: 'Rain per day: flag it'
    help: Off, rain per day is never flagged, whatever the two values below say.
    selector:
      boolean: {}
    default: true

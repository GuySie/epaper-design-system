    more: "+{e} till"
    title: Kalender
    all_day_prefix: 'Heldag: '
    no_events: Inga händelser
    no_calendars: Ingen kalender vald
layouts:
  '41':
    spec: calendar_41
    defaults:
      rotate: '0'
  '426':
    spec: calendar_426
    defaults:
      rotate: '0'

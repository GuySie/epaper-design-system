    title: Kalendarz
    all_day_prefix: 'Cały dzień: '
    no_events: Brak wydarzeń
    no_calendars: Nie wybrano kalendarza
  hr:
    today: "Danas"
    more: "+{e} još"
    title: Kalendar
    all_day_prefix: 'Cijeli dan: '
    no_events: Nema događaja
    no_calendars: Nije odabran kalendar
  sv:

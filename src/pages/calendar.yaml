page: calendar
description:
  shows: The coming days, each under its day header with its events, today first; later days fold into one line when they
    don't fit.
  needs:
  - calendar
  trigger_advice: A time pattern every hour.
  based_on:
  - name: calendar automation by svenove
    url: https://github.com/svenove/OpenEPaperLink-HA-Calendar
  times: the event times and the update time
redraw: trigger
inputs:
- name: calendar_entities
  section: content
  label: Calendar(s)
  help: One or more calendar entities to source events from. Events from multiple calendars are merged into a single agenda.
  selector:
    entity:
      multiple: true
      filter:
        domain: calendar
  required: true
- name: days_shown
  section: content
  label: Days shown
  help: How many days ahead to display, starting today. Days that don't fit are left out; a day that doesn't fit whole ends with "+N more".
  selector:
    number:
      min: 1
      max: 7
      mode: box
  default: 6
bind:
- calendar_entities
- days_shown
data:
  variables:
  - include: event_text_pattern
  - header_title_display: '{{ header_title if header_title else language_map[weekday_lang][''title''] }}'
  draw:
    kind: choose
    when:
    - '{{ calendar_entities | count > 0 }}'
    steps:
    - action: calendar.get_events
      target:
        entity_id: '{{ calendar_entities }}'
      data:
        start_date_time: '{{ today_at(''00:00'') }}'
        end_date_time: '{{ today_at(''00:00'') + timedelta(days=days_shown) }}'
      response_variable: cal_events
    - variables:
        all_events: |
          {{ (cal_events.values() | map(attribute='events') | list | sum(start=[])) | sort(attribute='start') }}
        include: calendar_days
texts:
  include: calendar_texts
layouts:
  '41':
    spec: calendar_41
    defaults:
      rotate: '0'
  '426':
    spec: calendar_426
    defaults:
      rotate: '0'
footer: "none"

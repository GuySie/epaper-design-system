page: weather-calendar
description:
  shows: The weather's temperature as the hero with its details in the top half, the coming days with their events in the
    bottom half, with warnings and pollen as chips.
  needs:
  - calendar
  - weather
  optional:
  - sun
  - moon
  - kleenex_pollen
  trigger_advice: A time pattern every 15 or 30 minutes.
  notes:
  - A weather warning sensor (e.g. KNMI or Meteoalarm) turns the official warning level into a chip.
  title_default: '"Weather"'
redraw: trigger
stale: drawing
inputs:
- include: weather_sources
- include: weather_thresholds
- name: calendar_entities
  section: content
  label: Calendar(s)
  help: One or more calendar entities to source events from. Events from multiple calendars are merged into a single agenda.
    Leave empty and the calendar half says no calendar is chosen.
  selector:
    entity:
      multiple: true
      filter:
        domain: calendar
  default: []
- name: days_shown
  section: content
  label: Days shown
  help: How many days ahead to display, starting today. With many days and/or busy calendars, content may overflow the display's
    300px height.
  selector:
    number:
      min: 1
      max: 7
      mode: box
  default: 6
bind:
- weather_entity
- calendar_entities
- days_shown
ds_in: true
data:
  variables:
  - weekday_lang: '{{ ds_in.weekday_lang }}'
  - time_format: '{{ ds_in.time_format }}'
  - include: weather_forecast_entity
  - include: event_text_pattern
  steps:
  - if:
    - '{{ forecast_entity != ''unavailable'' }}'
    then:
    - action: weather.get_forecasts
      target:
        entity_id: '{{ forecast_entity }}'
      data:
        type: daily
      response_variable: ds_fd
    - if:
      - '{{ (state_attr(forecast_entity, ''supported_features'') | int(0)) | bitwise_and(2) > 0 }}'
      then:
      - action: weather.get_forecasts
        target:
          entity_id: '{{ forecast_entity }}'
        data:
          type: hourly
        response_variable: ds_fh
  - if:
    - '{{ calendar_entities | count > 0 }}'
    then:
    - action: calendar.get_events
      target:
        entity_id: '{{ calendar_entities }}'
      data:
        start_date_time: '{{ today_at(''00:00'') }}'
        end_date_time: '{{ today_at(''00:00'') + timedelta(days=days_shown) }}'
      response_variable: cal_events
  - variables:
      all_events: |
        {{ ((cal_events.values() | map(attribute='events') | list | sum(start=[])) | sort(attribute='start')) if cal_events is defined else [] }}
      include: calendar_days
  draw:
    kind: weather
layouts:
  75p:
    spec: weather_calendar_75p
    inputs:
    - name: weather_entity
      section: content
      label: Weather entity
      help: The weather entity to show. While it isn't working, another working weather entity is used instead. Must support
        the daily forecast type.
      selector:
        entity:
          filter:
            domain: weather
      required: true
    - name: moon_phase_sensor
      section: content
      label: Moon phase sensor
      help: Sensor used for the moon phase badge on the weather icon. Leave blank to detect the Moon integration's sensor
        automatically (its entity ID is translated, so it isn't always `sensor.moon_phase`). Set this to use a different sensor,
        such as the Lunar Phase integration's "Moon Phase" sensor. No Moon sensor means no badge.
      selector:
        entity:
          domain: sensor
      default: ''
    - name: location_string
      section: appearance
      label: Location name
      help: Label displayed at the top of the screen (e.g. 'Chicago, Illinois')
      selector:
        text: null
      default: ''
      after: severe_conditions
    title_default: '"Weather" plus the location'
texts:
  include: calendar_texts

page: entities
description:
  shows: Up to {n:entity} entities in one or two columns, each with its label, state and unit; empty slots are skipped.
  needs_also:
  - The entities to show (any domain).
  trigger_advice: A time pattern every 15 minutes, or a state trigger on the entities that matter most.
redraw: trigger
stale:
- entity_1
- entity_2
- entity_3
- entity_4
- entity_5
- entity_6
- entity_7
- entity_8
- entity_9
- entity_10
- entity_11
- entity_12
inputs:
- name: entity_1
  section: content
  label: Entity 1
  help: Entity for row 1.
  selector:
    entity: {}
  required: true
- repeat:
    from: 2
    to: 12
    items:
    - name: entity_{n}
      section: content
      label: Entity {n}
      help: Entity for row {n}. Leave blank to disable this row.
      selector:
        entity: {}
      default: ''
- repeat:
    from: 1
    to: 12
    items:
    - name: entity_{n}_label
      section: content
      label: Entity {n} - label
      help: Optional label override. Leave blank to derive it from the entity's name.
      selector:
        text: {}
      default: ''
bind:
- repeat:
    from: 1
    to: 12
    items:
    - entity_{n}
    - entity_{n}_label
data:
  variables:
  - entities: |
      {% set ns = namespace(list=[]) %} {% set slots = [
        {'entity': entity_1, 'label': entity_1_label},
        {'entity': entity_2, 'label': entity_2_label},
        {'entity': entity_3, 'label': entity_3_label},
        {'entity': entity_4, 'label': entity_4_label},
        {'entity': entity_5, 'label': entity_5_label},
        {'entity': entity_6, 'label': entity_6_label},
        {'entity': entity_7, 'label': entity_7_label},
        {'entity': entity_8, 'label': entity_8_label},
        {'entity': entity_9, 'label': entity_9_label},
        {'entity': entity_10, 'label': entity_10_label},
        {'entity': entity_11, 'label': entity_11_label},
        {'entity': entity_12, 'label': entity_12_label}
      ] %} {% for slot in slots %}
        {% if slot.entity and slot.entity != '' %}
          {% set label_text = slot.label if slot.label and slot.label != '' else (entity_name(slot.entity) or device_name(slot.entity) or slot.entity) %}
          {% set ns.list = ns.list + [{
            'label': label_text
          }] %}
        {% endif %}
      {% endfor %} {{ ns.list }}
  - include: default_title
  - ds_unavail_msg: '{{ language_map[weekday_lang][''most_unavailable''] }}'
  - ds_rows: |
      {% set ns = namespace(list=[]) %} {% set slots = [
        [entity_1, entity_1_label], [entity_2, entity_2_label], [entity_3, entity_3_label],
        [entity_4, entity_4_label], [entity_5, entity_5_label], [entity_6, entity_6_label],
        [entity_7, entity_7_label], [entity_8, entity_8_label], [entity_9, entity_9_label],
        [entity_10, entity_10_label], [entity_11, entity_11_label], [entity_12, entity_12_label]
      ] %} {% for e, lab in slots %}
        {% if e and e != '' %}
          {% set raw = states(e) %}
          {% set ok = raw not in ['unknown', 'unavailable', 'none', ''] %}
          {% set unit = state_attr(e, 'unit_of_measurement') or '' %}
          {% set label = lab if lab else (entity_name(e) or device_name(e) or e) %}
          {% set ns.list = ns.list + [{'label': label, 'raw': raw, 'unit': unit, 'ok': ok}] %}
        {% endif %}
      {% endfor %} {{ ns.list }}
  draw:
    kind: choose
    when:
    - '{{ entities | length > 0 }}'
    steps: []
texts:
  use:
    most_unavailable: most_unavailable
  en:
    no_entities: No entities configured.
    default_title: Entities
  de:
    no_entities: Keine Entitäten konfiguriert.
    default_title: Entitäten
  nl:
    no_entities: Geen entiteiten geconfigureerd.
    default_title: Entiteiten
  fr:
    no_entities: Aucune entité configurée.
    default_title: Entités
  es:
    no_entities: No hay entidades configuradas.
    default_title: Entidades
  pl:
    no_entities: Nie skonfigurowano żadnych encji.
    default_title: Encje
  hr:
    no_entities: Nije konfiguriran nijedan entitet.
    default_title: Entiteti
  sv:
    no_entities: Inga entiteter konfigurerade.
    default_title: Entiteter
examples:
- case: ex_entities_packages
  screen: '35'
  shows: "packages on their way"
  gap: M+
- case: ex_entities_server
  screen: '35'
  shows: "a home server"
  gap: M+
layouts:
  '35':
    spec: entities_35
footer: "none"

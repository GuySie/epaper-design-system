    - name: location_string
      section: appearance
      label: Location name
      help: Label displayed at the top of the screen (e.g. 'Chicago, Illinois')
      selector:
        text: null
      default: ''
      after: severe_conditions
    based_on:
    - name: OpenDisplay Weather blueprint by davelee98
      url: https://github.com/davelee98/ha-epaper-blueprints/blob/main/opendisplay_weather_800x480_bw.yaml
    title_default: '"Weather" plus the location'

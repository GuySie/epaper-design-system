    list_unavailable: Listan är inte tillgänglig
examples:
- case: ex_todo_chores
  screen: '41'
  shows: "the week's chores"
- case: ex_todo_packing
  screen: '35'
  shows: "a packing list"
layouts:
  27l:
    spec: todo_27l
  27p:
    spec: todo_27p
  '35':
    spec: todo_35
  '41':
    spec: todo_41
  '75':
    spec: todo_75
  75p:
    spec: todo_75p
thresholds:
- data: "An item's due day"
  warning: "due today"
  severe: "overdue"
footer: "(a) the count of open and done items"

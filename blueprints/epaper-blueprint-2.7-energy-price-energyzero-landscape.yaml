# Generated by lib/generate.py from pages/energy-price.yaml: edit the page definition, not this file.
blueprint:
  name: E-paper Energy price (EnergyZero) 2.7" landscape
  description: |
    # E-paper Energy price (EnergyZero) 2.7" landscape

    Today's electricity price per hour from EnergyZero, with the current price and the cheapest hours still to come.

    ## Works with

    2.7" (384 x 168) devices held landscape. Black and white, or with red, yellow or both.

    ## Needs

    - [OpenDisplay integration](https://github.com/OpenDisplay/Home_Assistant_Integration) (v3.0.0-beta.8 or later): installed and configured
    - [EnergyZero integration](https://www.home-assistant.io/integrations/energyzero/): set up in Home Assistant
    - The design-system templates: copy the four `ep_*.jinja` files from the repository's `custom_templates` folder into `config/custom_templates/`, then run `homeassistant.reload_custom_templates` (or restart Home Assistant). Update them together with the blueprints.
    - The design-system fonts in `/config/www/fonts/` (or another drawcustom font folder): `TRMNL12-Regular.ttf`, `TRMNL12-Bold.ttf`, `TRMNL16-Regular.ttf`, `TRMNL16-Bold.ttf`, `TRMNL21-Regular.ttf` and `TRMNL21-Bold.ttf` from the TRMNL font bundle (SIL OFL 1.1), and `SpaceGrotesk-Bold.ttf` (the static Bold file of Space Grotesk, SIL OFL 1.1).

    ## Trigger advice

    A time pattern at the start of every hour; a price lasts an hour.

    You can add a device's button to the trigger (an "Entity event received" trigger on its `event.*` entity, e.g. `event.<your_device>_button_1`). A press then flashes that device's LED straight away, so you know it registered before the ~30 second redraw. Time-based and other triggers don't flash. If the flash fails, the display is still updated.

    ## Notes

    - The price is EnergyZero's market price with VAT, without energy tax and purchase costs.
    - Button devices sold as 2.9": configure the firmware for 168 x 384, or the top 16 px are cut off.

    ## Links

    - [E-paper design system repository](https://github.com/GuySie/epaper-design-system)
    - [E-paper design system](https://github.com/GuySie/epaper-design-system/blob/main/docs/design-system.md)
    - [TRMNL font bundle](https://trmnl.com/font-family)
    - [Space Grotesk (Google Fonts)](https://fonts.google.com/specimen/Space+Grotesk)
    - [OpenDisplay integration](https://github.com/OpenDisplay/Home_Assistant_Integration)
    - [EnergyZero integration](https://www.home-assistant.io/integrations/energyzero/)
    - Made by [Guy Sie](https://github.com/guysie), with Claude
  source_url: https://github.com/GuySie/epaper-design-system/blob/main/blueprints/epaper-blueprint-2.7-energy-price-energyzero-landscape.yaml
  domain: automation
  input:
    display:
      name: Display and schedule
      icon: "mdi:monitor"
      input:
        displays:
          name: E-paper display(s)
          description: The 2.7" (384 x 168) devices to draw on
          selector:
            device:
              multiple: true
              filter:
                integration: opendisplay
        automation_trigger:
          name: Trigger
          description: When to trigger the automation
          selector:
            trigger: null
        automation_conditions:
          name: Conditions
          description: Optional conditions that must be met to run the automation
          default: []
          selector:
            condition: null
    content:
      name: Content
      icon: "mdi:view-list"
      input:
        energyzero_entry:
          name: EnergyZero
          description: The EnergyZero integration whose prices are shown.
          selector:
            config_entry:
              integration: energyzero
        cheapest_hours:
          name: Length of the cheapest run
          description: The footer names the cheapest run of this many hours in a row among the hours still to come today.
          default: 3
          selector:
            number:
              min: 1
              max: 12
              step: 1
              unit_of_measurement: h
              mode: box
    thresholds:
      name: Thresholds
      icon: "mdi:alert-outline"
      collapsed: true
      input:
        flag_price:
          name: 'Price: flag it'
          description: Off, no bar is flagged and the chart shows no threshold lines, whatever the two values below say.
          default: true
          selector:
            boolean: {}
        warning_price:
          name: 'Price: warning at or above'
          description: An hour at or above this price is a warning. The chart marks the value with the lower dashed line.
          default: 15
          selector:
            number:
              min: 0
              step: 1
              unit_of_measurement: ct/kWh
              mode: box
        severe_price:
          name: 'Price: severe at or above'
          description: An hour at or above this price is severe. The chart's scale runs up to one and a half times this value.
          default: 25
          selector:
            number:
              min: 0
              step: 1
              unit_of_measurement: ct/kWh
              mode: box
    appearance:
      name: Appearance
      icon: "mdi:palette-outline"
      collapsed: true
      input:
        header_title:
          name: Header title
          description: Shown in capitals at the top left. Leave blank for "Energy price" in your language.
          default: ''
          selector:
            text: {}
        time_format:
          name: Time format
          description: 12-hour (AM/PM) or 24-hour clock for the times on the display.
          default: 24h
          selector:
            select:
              options:
              - label: 12-hour (AM/PM)
                value: 12h
              - label: 24-hour
                value: 24h
        weekday_format:
          name: Language
          description: 'Language of the texts on the display: titles, day and month names, messages.'
          default: en
          selector:
            select:
              options:
              - label: English
                value: en
              - label: German
                value: de
              - label: Dutch
                value: nl
              - label: French
                value: fr
              - label: Spanish
                value: es
              - label: Polish
                value: pl
              - label: Croatian
                value: hr
              - label: Swedish
                value: sv
        rotate:
          name: Rotation
          description: 'Display rotation in degrees. This panel is natively portrait (168 x 384): 270 draws this layout upright,
            90 upside down.'
          default: '270'
          selector:
            select:
              options:
              - label: '0'
                value: '0'
              - label: '90'
                value: '90'
              - label: '180'
                value: '180'
              - label: '270'
                value: '270'
    advanced:
      name: Advanced
      icon: "mdi:cog"
      collapsed: true
      input:
        led_color:
          name: LED flash colour
          description: Colour of the confirmation flash when the update was triggered by a device button press.
          default:
          - 0
          - 255
          - 0
          selector:
            color_rgb: {}
        led_flash_delay:
          name: LED flash interval
          description: Time between the confirmation flashes.
          default: 500
          selector:
            number:
              min: 100
              max: 1500
              step: 100
              unit_of_measurement: ms
              mode: slider
        font_dir:
          name: Font folder (optional)
          description: Leave empty when the design-system fonts (TRMNL12/16/21 Regular + Bold and SpaceGrotesk-Bold.ttf) are
            in one of drawcustom's font folders (/config/www/fonts, /config/media/fonts or /media/fonts). Otherwise give an
            absolute folder path ending in a slash, e.g. /config/fonts/
          default: ''
          selector:
            text: {}
variables:
  ds_set: 'evgtmi'
  font_dir: !input 'font_dir'
  ds_devs: !input 'displays'
  weekday_lang: !input 'weekday_format'
  time_format: !input 'time_format'
  header_title: !input 'header_title'
  cheapest_hours: !input 'cheapest_hours'
  flag_price: !input 'flag_price'
  severe_price: !input 'severe_price'
  warning_price: !input 'warning_price'
  language_map: "{%- from 'ep_i18n.jinja' import EP_TXT -%}{{ EP_TXT['energy-price'] }}"
  price_bars: 24
  ds_txt: |
    {% set m = {
      "en": {"title": "Energy price", "now": "Now", "cheapest": "Cheapest", "none": "No prices", "unit": "ct"},
      "de": {"title": "Strompreis", "now": "Jetzt", "cheapest": "Günstig", "none": "Keine Preise", "unit": "ct"},
      "nl": {"title": "Stroomprijs", "now": "Nu", "cheapest": "Goedkoopst", "none": "Geen prijzen", "unit": "ct"},
      "fr": {"title": "Prix de l'électricité", "now": "Actuel", "cheapest": "Moins cher", "none": "Pas de prix", "unit": "ct"},
      "es": {"title": "Precio de la luz", "now": "Ahora", "cheapest": "Más barato", "none": "Sin precios", "unit": "ct"},
      "pl": {"title": "Cena prądu", "now": "Teraz", "cheapest": "Najtaniej", "none": "Brak cen", "unit": "ct"},
      "hr": {"title": "Cijena struje", "now": "Sada", "cheapest": "Najjeftinije", "none": "Nema cijena", "unit": "ct"},
      "sv": {"title": "Elpris", "now": "Nu", "cheapest": "Billigast", "none": "Inga priser", "unit": "ct"}
    } %} {{ m[weekday_lang] }}
  ds_title: '{{ header_title if header_title else ds_txt[''title''] }}'
trigger: !input 'automation_trigger'
conditions: !input 'automation_conditions'
action:
- alias: 'Button feedback: flash the pressed device''s LED'
  if:
  - condition: template
    value_template: |-
      {{ trigger is defined and trigger.entity_id is defined and trigger.entity_id is string
         and trigger.entity_id.startswith('event.') and device_id(trigger.entity_id) is not none }}
  then:
  - action: opendisplay.activate_led
    continue_on_error: true
    data:
      device_id: '{{ device_id(trigger.entity_id) }}'
      color1: !input 'led_color'
      flash_count1: 2
      loop_delay1: !input 'led_flash_delay'
      brightness: 16
      repeats: 1
- action: energyzero.get_energy_prices
  continue_on_error: true
  data:
    config_entry: !input 'energyzero_entry'
    incl_vat: true
  response_variable: ds_prices
- variables:
    hours: |
      {% set ns = namespace(list=[], n=0) %}
      {% set raw = (ds_prices.prices | default([])) if (ds_prices is defined and ds_prices is mapping) else [] %}
      {% set day = as_timestamp(today_at('00:00')) %}
      {% for i in range(price_bars) %}
        {% set ts = day + i * 3600 %}
        {% set hit = namespace(v=none) %}
        {% for p in raw %}
          {% if ((as_timestamp(p.start | default(p.timestamp), 0) - ts) | abs) < 60 and p.price is number %}
            {% set hit.v = (p.price * 100) | round | int %}
          {% endif %}
        {% endfor %}
        {% if hit.v is not none %}{% set ns.n = ns.n + 1 %}{% endif %}
        {% set ns.list = ns.list + [{'index': i, 'ts': ts, 'ct': hit.v}] %}
      {% endfor %}
      {{ ns.list if ns.n > 0 else [] }}
- choose:
  - conditions:
    - '{{ hours | length > 0 }}'
    sequence:
    - action: opendisplay.drawcustom
      target:
        device_id: !input 'displays'
      data:
        background: white
        dither: none
        rotate: !input 'rotate'
        payload: '{%- from ''ep_design.jinja'' import ep_draw -%} {{- (ep_draw | as_function)(''energy_price_27l'', ''main'',
          {''ds_set'': ds_set, ''ds_devs'': ds_devs, ''font_dir'': font_dir, ''cheapest_hours'': cheapest_hours, ''ds_title'':
          ds_title, ''ds_txt'': ds_txt, ''flag_price'': flag_price, ''hours'': hours, ''severe_price'': severe_price, ''time_format'':
          time_format, ''warning_price'': warning_price, ''weekday_lang'': weekday_lang}) -}}'
  default:
  - action: opendisplay.drawcustom
    target:
      device_id: !input 'displays'
    data:
      background: white
      dither: none
      rotate: !input 'rotate'
      payload: '{%- from ''ep_design.jinja'' import ep_draw -%} {{- (ep_draw | as_function)(''energy_price_27l'', ''error'',
        {''ds_set'': ds_set, ''ds_devs'': ds_devs, ''font_dir'': font_dir, ''ds_title'': ds_title, ''language_map'': language_map,
        ''time_format'': time_format, ''weekday_lang'': weekday_lang}) -}}'
mode: single
max_exceeded: silent

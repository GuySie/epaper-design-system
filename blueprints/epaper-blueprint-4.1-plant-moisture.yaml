  plants: |
    {% set ns = namespace(list=[]) %} {% set slots = [
      {'entity': plant_1, 'label': plant_1_label},
      {'entity': plant_2, 'label': plant_2_label},
      {'entity': plant_3, 'label': plant_3_label},
      {'entity': plant_4, 'label': plant_4_label},
      {'entity': plant_5, 'label': plant_5_label},
      {'entity': plant_6, 'label': plant_6_label},
      {'entity': plant_7, 'label': plant_7_label},
      {'entity': plant_8, 'label': plant_8_label},
      {'entity': plant_9, 'label': plant_9_label},
      {'entity': plant_10, 'label': plant_10_label},
      {'entity': plant_11, 'label': plant_11_label},
      {'entity': plant_12, 'label': plant_12_label},
      {'entity': plant_13, 'label': plant_13_label},
      {'entity': plant_14, 'label': plant_14_label},
      {'entity': plant_15, 'label': plant_15_label},
      {'entity': plant_16, 'label': plant_16_label},
      {'entity': plant_17, 'label': plant_17_label},
      {'entity': plant_18, 'label': plant_18_label},
      {'entity': plant_19, 'label': plant_19_label},
      {'entity': plant_20, 'label': plant_20_label},
      {'entity': plant_21, 'label': plant_21_label},
      {'entity': plant_22, 'label': plant_22_label}
    ] %} {% for slot in slots %}
      {% if slot.entity and slot.entity != '' %}
        {% set raw_state = states(slot.entity) %}
        {% set has_value = raw_state not in ['unknown', 'unavailable', 'none', ''] %}
        {% set pct_raw = (raw_state | float(0)) if has_value else 0 %}
        {% set pct_raw = ([pct_raw, 0] | max) %}
        {% set pct_raw = ([pct_raw, 100] | min) %}
        {% set pct = pct_raw | round | int %}
        {% set fname = device_name(slot.entity) or entity_name(slot.entity) or slot.entity %}
        {% set fname_lower = fname | lower %}
        {% if slot.label and slot.label != '' %}
          {% set label_text = slot.label %}
        {% elif fname_lower.endswith(' soil moisture') %}
          {% set label_text = fname[:-14] %}
        {% elif fname_lower.endswith(' moisture') %}
          {% set label_text = fname[:-9] %}
        {% else %}
          {% set label_text = fname %}
        {% endif %}
        {% set ns.list = ns.list + [{
          'label': label_text,
          'pct': pct,
          'ok': has_value
        }] %}
      {% endif %}
    {% endfor %} {{ ns.list }}
  header_title_display: '{{ header_title if header_title else language_map[weekday_lang][''default_title''] }}'
  ds_plants: |
    {% set ok = plants | selectattr('ok') | list %} {% set bad = plants | rejectattr('ok') | list %} {{ ((ok | sort(attribute='pct')) + bad) if sort_driest_first else plants }}
  ds_last_ts: |-
    {% set ns = namespace(t=0) %} {% for e in [plant_1, plant_2, plant_3, plant_4, plant_5, plant_6, plant_7, plant_8, plant_9, plant_10, plant_11, plant_12, plant_13, plant_14, plant_15, plant_16, plant_17, plant_18, plant_19, plant_20, plant_21, plant_22] %}
      {% if e %}{% for s in expand(e) %}{% set ns.t = [ns.t, as_timestamp(s.last_reported | default(s.last_updated), 0)] | max %}{% endfor %}{% endif %}
    {% endfor %} {{ ns.t }}
  ds_stale: '{{ (stale_after | int(0)) > 0 and (ds_last_ts | float(0)) > 0 and (as_timestamp(now()) - (ds_last_ts | float(0)))
    > (stale_after | int(0)) * 60 }}'
trigger: !input 'automation_trigger'
conditions: !input 'automation_conditions'
action:
- alias: 'Button feedback: flash the pressed device''s LED'
  if:
  - condition: template
    value_template: |-
      {{ trigger is defined and trigger.entity_id is defined and trigger.entity_id is string
         and trigger.entity_id.startswith('event.') and device_id(trigger.entity_id) is not none }}
  then:
  - action: opendisplay.activate_led
    continue_on_error: true
    data:
      device_id: '{{ device_id(trigger.entity_id) }}'
      color1: !input 'led_color'
      flash_count1: 2
      loop_delay1: !input 'led_flash_delay'
      brightness: 16
      repeats: 1
- choose:
  - conditions:
    - '{{ plants | length > 0 }}'
    sequence:
    - action: opendisplay.drawcustom
      target:
        device_id: !input 'displays'
      data:
        background: white
        dither: none
        rotate: !input 'rotate'
        payload: '{%- from ''ep_design.jinja'' import ep_draw -%} {{- (ep_draw | as_function)(''plants_41'', ''main'', {''ds_set'':
          ds_set, ''ds_devs'': ds_devs, ''font_dir'': font_dir, ''ds_last_ts'': ds_last_ts, ''ds_plants'': ds_plants, ''ds_stale'':
          ds_stale, ''flag_moisture_low'': flag_moisture_low, ''header_title_display'': header_title_display, ''language_map'':
          language_map, ''severe_moisture_low'': severe_moisture_low, ''time_format'': time_format, ''warning_moisture_low'':
          warning_moisture_low, ''weekday_lang'': weekday_lang}) -}}'
  default:
  - action: opendisplay.drawcustom
    target:
      device_id: !input 'displays'
    data:
      background: white
      dither: none
      rotate: !input 'rotate'
      payload: '{%- from ''ep_design.jinja'' import ep_draw -%} {{- (ep_draw | as_function)(''plants_41'', ''error'', {''ds_set'':
        ds_set, ''ds_devs'': ds_devs, ''font_dir'': font_dir, ''header_title_display'': header_title_display, ''language_map'':
        language_map, ''time_format'': time_format, ''weekday_lang'': weekday_lang}) -}}'
mode: single
max_exceeded: silent

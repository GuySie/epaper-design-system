          description: The 2.7" (384 x 168) devices to draw on
          selector:
            device:
              multiple: true
              filter:
                integration: opendisplay
        automation_trigger:
          name: Trigger
          description: When to trigger the automation
          selector:
            trigger: null
        automation_conditions:
          name: Conditions
          description: Optional conditions that must be met to run the automation
          default: []
          selector:
            condition: null
    content:
      name: Content
      icon: "mdi:view-list"
      input:
        entity:
          name: Sensor
          description: The sensor to graph (with long-term statistics).
          selector:
            entity:
              filter:
                domain: sensor
        hours:
          name: Time span
          description: How much history the graph shows
          default: '12'
          selector:
            select:
              options:
              - label: 3 hours
                value: '3'
              - label: 6 hours
                value: '6'
              - label: 12 hours
                value: '12'
              - label: 24 hours
                value: '24'
    thresholds:
      name: Thresholds
      icon: "mdi:alert-outline"
      collapsed: true
      input:
        flag_high:
          name: 'High: flag it'
          description: On, the graph draws the two values below as lines and fills the spans at or above them.
          default: false
          selector:
            boolean: {}
        warning_high:
          name: 'High: warning at or above'
          description: A span at or above this is a warning.
          default: 0
          selector:
            number:
              mode: box
              step: any
        severe_high:
          name: 'High: severe at or above'
          description: A span at or above this is severe.
          default: 0
          selector:
            number:
              mode: box
              step: any
        flag_low:
          name: 'Low: flag it'
          description: On, the graph draws the two values below as lines and fills the spans at or below them.
          default: false
          selector:
            boolean: {}
        warning_low:
          name: 'Low: warning at or below'
          description: A span at or below this is a warning.
          default: 0
          selector:
            number:
              mode: box
              step: any
        severe_low:
          name: 'Low: severe at or below'
          description: A span at or below this is severe.
          default: 0
          selector:
            number:

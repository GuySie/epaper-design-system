variables:
  ds_set: 'hznzts'
  font_dir: !input 'font_dir'
  ds_devs: !input 'displays'
  weekday_lang: !input 'weekday_format'
  time_format: !input 'time_format'
  header_title: !input 'header_title'
  bin_1: !input 'bin_1'
  bin_1_label: !input 'bin_1_label'
  bin_1_icon: !input 'bin_1_icon'
  bin_2: !input 'bin_2'
  bin_2_label: !input 'bin_2_label'
  bin_2_icon: !input 'bin_2_icon'
  bin_3: !input 'bin_3'
  bin_3_label: !input 'bin_3_label'
  bin_3_icon: !input 'bin_3_icon'
  bin_4: !input 'bin_4'
  bin_4_label: !input 'bin_4_label'
  bin_4_icon: !input 'bin_4_icon'
  flag_soon: !input 'flag_soon'
  language_map: "{%- from 'ep_i18n.jinja' import EP_TXT -%}{{ EP_TXT['bin-day'] }}"
  header_title_display: '{{ header_title if header_title else language_map[weekday_lang][''default_title''] }}'
  text_strip_pattern: '[^ -ɏ‐-‧‰-※€™]'
  ds_bins: |
    {% set ns = namespace(l=[]) %} {% set slots = [
            {'e': bin_1 | default(''), 'label': bin_1_label | default(''), 'icon': bin_1_icon | default('')},
            {'e': bin_2 | default(''), 'label': bin_2_label | default(''), 'icon': bin_2_icon | default('')},
            {'e': bin_3 | default(''), 'label': bin_3_label | default(''), 'icon': bin_3_icon | default('')},
            {'e': bin_4 | default(''), 'label': bin_4_label | default(''), 'icon': bin_4_icon | default('')}
          ] %} {% for s in slots %}{% if s.e %}
            {% set raw = states(s.e) %}
            {% if raw not in ['unknown', 'unavailable', 'none', ''] and raw | length >= 10 %}
              {% set dt = as_datetime(raw, none) if raw | length > 10 else none %}
              {% set d = as_local(dt) if dt is not none else strptime(raw[:10], '%Y-%m-%d', none) %}
              {% if d is not none %}{% set n = (d.date() - now().date()).days %}
                {% if n >= 0 %}{% set ns.l = ns.l + [{'word': ((s.label if s.label else (entity_name(s.e) or device_name(s.e) or s.e)) | string | regex_replace(text_strip_pattern, '') | regex_replace(' {2,}', ' ') | trim), 'name': ((entity_name(s.e) or device_name(s.e) or s.e) | string | regex_replace(text_strip_pattern, '') | trim), 'icon': s.icon, 'd': n, 'wd': d.weekday(), 'day': d.day, 'mon': d.month}] %}{% endif %}
              {% endif %}
            {% endif %}
          {% endif %}{% endfor %} {{ ns.l | sort(attribute='d') }}
trigger: !input 'automation_trigger'
conditions: !input 'automation_conditions'
action:
- alias: 'Button feedback: flash the pressed device''s LED'
  if:
  - condition: template
    value_template: |-
      {{ trigger is defined and trigger.entity_id is defined and trigger.entity_id is string
         and trigger.entity_id.startswith('event.') and device_id(trigger.entity_id) is not none }}
  then:
  - action: opendisplay.activate_led
    continue_on_error: true
    data:
      device_id: '{{ device_id(trigger.entity_id) }}'
      color1: !input 'led_color'
      flash_count1: 2
      loop_delay1: !input 'led_flash_delay'
      brightness: 16
      repeats: 1
- choose:
  - conditions:
    - condition: template
      value_template: '{{ ds_bins | count > 0 }}'
    sequence:
    - action: opendisplay.drawcustom
      target:
        device_id: !input 'displays'
      data:
        background: white
        dither: none
        rotate: !input 'rotate'
        payload: '{%- from ''ep_design.jinja'' import ep_draw -%} {{- (ep_draw | as_function)(''bin_day_41'', ''main'', {''ds_set'':
          ds_set, ''ds_devs'': ds_devs, ''font_dir'': font_dir, ''ds_bins'': ds_bins, ''flag_soon'': flag_soon, ''header_title_display'':
          header_title_display, ''language_map'': language_map, ''time_format'': time_format, ''weekday_lang'': weekday_lang})
          -}}'
  default:
  - action: opendisplay.drawcustom
    target:
      device_id: !input 'displays'
    data:
      background: white
      dither: none
      rotate: !input 'rotate'
      payload: '{%- from ''ep_design.jinja'' import ep_draw -%} {{- (ep_draw | as_function)(''bin_day_41'', ''error'', {''ds_set'':
        ds_set, ''ds_devs'': ds_devs, ''font_dir'': font_dir, ''header_title_display'': header_title_display, ''language_map'':
        language_map, ''time_format'': time_format, ''weekday_lang'': weekday_lang}) -}}'
mode: single
max_exceeded: silent

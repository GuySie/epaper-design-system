          default: ''
          selector:
            entity: {}
        detail_2:
          name: Detail 2
          description: An entity shown beside the number, with its label and its value. Leave blank for no row.
          default: ''
          selector:
            entity: {}
        detail_3:
          name: Detail 3
          description: An entity shown beside the number, with its label and its value. Leave blank for no row.
          default: ''
          selector:
            entity: {}
        detail_4:

variables:
  ds_set: 'hznzts'
  font_dir: !input 'font_dir'
  ds_devs: !input 'displays'
  stale_after: !input 'stale_after'
  weekday_lang: !input 'weekday_format'
  time_format: !input 'time_format'
  header_title: !input 'header_title'
  entity: !input 'entity'
  hours: !input 'hours'
  ds_icon: !input 'icon'
  detail_1: !input 'detail_1'
  detail_1_label: !input 'detail_1_label'
  detail_2: !input 'detail_2'
  detail_2_label: !input 'detail_2_label'
  detail_3: !input 'detail_3'
  detail_3_label: !input 'detail_3_label'
  detail_4: !input 'detail_4'
  detail_4_label: !input 'detail_4_label'
  flag_high: !input 'flag_high'
  warning_high: !input 'warning_high'
  severe_high: !input 'severe_high'
  flag_low: !input 'flag_low'
  warning_low: !input 'warning_low'
  severe_low: !input 'severe_low'
  language_map: "{%- from 'ep_i18n.jinja' import EP_TXT -%}{{ EP_TXT['value-details'] }}"
  hist_points: 357
  ds_title: '{{ header_title if header_title else (entity_name(entity) or device_name(entity) or entity) }}'
  ds_unit: '{{ state_attr(entity, ''unit_of_measurement'') or '''' }}'
  ds_value: |
    {% set raw = states(entity) %} {% set ok = raw not in ['unknown', 'unavailable', 'none', ''] %} {% set n = raw | float(none) %}
    {% set lvl = '' %}
    {% if ok and n is not none %}
      {% if (flag_high and n >= (severe_high | float(0))) or (flag_low and n <= (severe_low | float(0))) %}{% set lvl = 'sev' %}
      {% elif (flag_high and n >= (warning_high | float(0))) or (flag_low and n <= (warning_low | float(0))) %}{% set lvl = 'warn' %}{% endif %}
    {% endif %}
    {{ {'raw': raw if ok else '', 'unit': (state_attr(entity, 'unit_of_measurement') or '') if ok else '', 'level': lvl} }}
  ds_details: |
    {% set ns = namespace(list=[]) %} {% for e, lab in [[detail_1 | default(''), detail_1_label | default('')], [detail_2 | default(''), detail_2_label | default('')], [detail_3 | default(''), detail_3_label | default('')], [detail_4 | default(''), detail_4_label | default('')]] %}
      {% if e and e != '' %}
        {% set raw = states(e) %} {% set ok = raw not in ['unknown', 'unavailable', 'none', ''] %}
        {% set word = state_translated(e) if (ok and raw | float(none) is none) else raw %}
        {% set ns.list = ns.list + [{'label': lab if lab else (entity_name(e) or device_name(e) or e), 'raw': word, 'unit': (state_attr(e, 'unit_of_measurement') or '') if ok else '', 'ok': ok}] %}
      {% endif %}
    {% endfor %} {{ ns.list }}
  ds_last_ts: |-
    {% set ns = namespace(t=0) %} {% for e in [entity] %}
      {% if e %}{% for s in expand(e) %}{% set ns.t = [ns.t, as_timestamp(s.last_reported | default(s.last_updated), 0)] | max %}{% endfor %}{% endif %}
    {% endfor %} {{ ns.t }}
  ds_stale: '{{ (stale_after | int(0)) > 0 and (ds_last_ts | float(0)) > 0 and (as_timestamp(now()) - (ds_last_ts | float(0)))
    > (stale_after | int(0)) * 60 }}'
trigger: !input 'automation_trigger'
conditions: !input 'automation_conditions'
action:
- alias: 'Button feedback: flash the pressed device''s LED'
  if:
  - condition: template
    value_template: |-
      {{ trigger is defined and trigger.entity_id is defined and trigger.entity_id is string
         and trigger.entity_id.startswith('event.') and device_id(trigger.entity_id) is not none }}
  then:
  - action: opendisplay.activate_led
    continue_on_error: true
    data:
      device_id: '{{ device_id(trigger.entity_id) }}'
      color1: !input 'led_color'
      flash_count1: 2
      loop_delay1: !input 'led_flash_delay'
      brightness: 16
      repeats: 1
- action: recorder.get_statistics
  continue_on_error: true
  data:
    statistic_ids:
    - '{{ entity }}'
    start_time: '{{ (now() - timedelta(hours=hours | int(12))).strftime(''%Y-%m-%d %H:%M:%S'') }}'
    period: 5minute
    types:
    - mean
    - max
    - min
  response_variable: hist_stats
- variables:
    ds_t1: '{{ as_timestamp(now()) }}'
    ds_t0: '{{ as_timestamp(now()) - (hours | int(12)) * 3600 }}'
    ds_bucket: '{{ [((hours | int(12)) * 12 / hist_points) | round(0, ''ceil'') | int, 1] | max }}'
    ds_pts: |
      {% set st = hist_stats.statistics if (hist_stats is defined and hist_stats is mapping and hist_stats.statistics is defined) else {} %} {% set raw = (st[entity] if entity in st else []) | selectattr('mean', 'defined') | list %} {% set ns = namespace(list=[]) %} {% for g in raw | batch(ds_bucket | int(1)) %}
        {% set vals = g | map(attribute='mean') | reject('none') | list %}
        {% set mxs = g | map(attribute='max') | reject('none') | list %}
        {% set mns = g | map(attribute='min') | reject('none') | list %}
        {% if vals | length > 0 %}
          {% set ts = ((as_timestamp(g[0].start) + as_timestamp(g[-1].end)) / 2) %}
          {% set ns.list = ns.list + [{'ts': ts, 'v': (vals | sum) / (vals | length), 'mx': (mxs | max) if mxs else (vals | max), 'mn': (mns | min) if mns else (vals | min)}] %}
        {% endif %}
      {% endfor %} {% set cur = states(entity) | float(none) %} {% if cur is not none and (ns.list | length) > 0 %}
        {% set ns.list = ns.list + [{'ts': as_timestamp(now()), 'v': cur, 'mx': cur, 'mn': cur}] %}
      {% endif %} {{ ns.list }}
- action: opendisplay.drawcustom
  target:
    device_id: !input 'displays'
  data:
    background: white
    dither: none
    rotate: !input 'rotate'
    payload: '{%- from ''ep_design.jinja'' import ep_draw -%} {{- (ep_draw | as_function)(''value_details_75'', ''main'',
      {''ds_set'': ds_set, ''ds_devs'': ds_devs, ''font_dir'': font_dir, ''ds_bucket'': ds_bucket, ''ds_details'': ds_details,
      ''ds_icon'': ds_icon, ''ds_last_ts'': ds_last_ts, ''ds_pts'': ds_pts, ''ds_stale'': ds_stale, ''ds_t0'': ds_t0, ''ds_t1'':
      ds_t1, ''ds_title'': ds_title, ''ds_value'': ds_value, ''flag_high'': flag_high, ''flag_low'': flag_low, ''language_map'':
      language_map, ''severe_high'': severe_high, ''severe_low'': severe_low, ''time_format'': time_format, ''warning_high'':
      warning_high, ''warning_low'': warning_low, ''weekday_lang'': weekday_lang}) -}}'
mode: single
max_exceeded: silent

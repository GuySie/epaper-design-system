variables:
  ds_set: 'otxyin'
  font_dir: !input 'font_dir'
  ds_devs: !input 'displays'
  stale_after: !input 'stale_after'
  weekday_lang: !input 'weekday_format'
  time_format: !input 'time_format'
  header_title: !input 'header_title'
  bar_1: !input 'bar_1'
  bar_1_label: !input 'bar_1_label'
  bar_1_max: !input 'bar_1_max'
  bar_2: !input 'bar_2'
  bar_2_label: !input 'bar_2_label'
  bar_2_max: !input 'bar_2_max'
  bar_3: !input 'bar_3'
  bar_3_label: !input 'bar_3_label'
  bar_3_max: !input 'bar_3_max'
  bar_4: !input 'bar_4'
  bar_4_label: !input 'bar_4_label'
  bar_4_max: !input 'bar_4_max'
  flag_high: !input 'flag_high'
  warning_high: !input 'warning_high'
  severe_high: !input 'severe_high'
  flag_low: !input 'flag_low'
  warning_low: !input 'warning_low'
  severe_low: !input 'severe_low'
  language_map: "{%- from 'ep_i18n.jinja' import EP_TXT -%}{{ EP_TXT['levels'] }}"
  header_title_display: '{{ header_title if header_title else language_map[weekday_lang][''default_title''] }}'
  ds_levels: |
    {% set ns = namespace(list=[]) %} {% set slots = [
            {'entity': bar_1 | default(''), 'label': bar_1_label | default(''), 'max': bar_1_max | default(100)},
            {'entity': bar_2 | default(''), 'label': bar_2_label | default(''), 'max': bar_2_max | default(100)},
            {'entity': bar_3 | default(''), 'label': bar_3_label | default(''), 'max': bar_3_max | default(100)},
            {'entity': bar_4 | default(''), 'label': bar_4_label | default(''), 'max': bar_4_max | default(100)},
            {'entity': bar_5 | default(''), 'label': bar_5_label | default(''), 'max': bar_5_max | default(100)},
            {'entity': bar_6 | default(''), 'label': bar_6_label | default(''), 'max': bar_6_max | default(100)}
          ] %} {% for slot in slots %}
            {% if slot.entity is defined and slot.entity and slot.entity != '' %}
              {% set raw = states(slot.entity) %} {% set n = raw | float(none) %} {% set ok = raw not in ['unknown', 'unavailable', 'none', ''] and n is not none %}
              {% set mx = slot.max | float(100) %} {% set pct = (([[n / (mx if mx > 0 else 100) * 100, 0] | max, 100] | min) if ok else 0) %}
              {% set lvl = '' %}
              {% if ok %}
                {% if (flag_high and pct >= (severe_high | float(0))) or (flag_low and pct <= (severe_low | float(0))) %}{% set lvl = 'sev' %}
                {% elif (flag_high and pct >= (warning_high | float(0))) or (flag_low and pct <= (warning_low | float(0))) %}{% set lvl = 'warn' %}{% endif %}
              {% endif %}
              {% set fname = entity_name(slot.entity) or device_name(slot.entity) or slot.entity %}
              {% set ns.list = ns.list + [{'label': slot.label if slot.label else fname, 'raw': raw if ok else '', 'unit': (state_attr(slot.entity, 'unit_of_measurement') or '') if ok else '', 'pct': pct | round | int, 'level': lvl, 'ok': ok}] %}
            {% endif %}
          {% endfor %} {{ ns.list }}
  ds_last_ts: |-
    {% set ns = namespace(t=0) %} {% for e in [bar_1, bar_2, bar_3, bar_4] %}
      {% if e %}{% for s in expand(e) %}{% set ns.t = [ns.t, as_timestamp(s.last_reported | default(s.last_updated), 0)] | max %}{% endfor %}{% endif %}
    {% endfor %} {{ ns.t }}
  ds_stale: '{{ (stale_after | int(0)) > 0 and (ds_last_ts | float(0)) > 0 and (as_timestamp(now()) - (ds_last_ts | float(0)))
    > (stale_after | int(0)) * 60 }}'
trigger: !input 'automation_trigger'
conditions: !input 'automation_conditions'
action:
- alias: 'Button feedback: flash the pressed device''s LED'
  if:
  - condition: template
    value_template: |-
      {{ trigger is defined and trigger.entity_id is defined and trigger.entity_id is string
         and trigger.entity_id.startswith('event.') and device_id(trigger.entity_id) is not none }}
  then:
  - action: opendisplay.activate_led
    continue_on_error: true
    data:
      device_id: '{{ device_id(trigger.entity_id) }}'
      color1: !input 'led_color'
      flash_count1: 2
      loop_delay1: !input 'led_flash_delay'
      brightness: 16
      repeats: 1
- action: opendisplay.drawcustom
  target:
    device_id: !input 'displays'
  data:
    background: white
    dither: none
    rotate: !input 'rotate'
    payload: '{%- from ''ep_design.jinja'' import ep_draw -%} {{- (ep_draw | as_function)(''levels_27l'', ''main'', {''ds_set'':
      ds_set, ''ds_devs'': ds_devs, ''font_dir'': font_dir, ''ds_last_ts'': ds_last_ts, ''ds_levels'': ds_levels, ''ds_stale'':
      ds_stale, ''header_title_display'': header_title_display, ''language_map'': language_map, ''time_format'': time_format,
      ''weekday_lang'': weekday_lang}) -}}'
mode: single
max_exceeded: silent

# Generated by lib/generate.py from pages/doors-windows.yaml: edit the page definition, not this file.
blueprint:
  name: E-paper Doors & windows 1.4"
  description: |
    # E-paper Doors & windows 1.4"

    How many of your outside doors and windows are open, and which one, so you can check before you leave.

    ## Works with

    1.4" (200 x 200) devices. Black and white, or with red, yellow or both.

    ## Needs

    - [OpenDisplay integration](https://github.com/OpenDisplay/Home_Assistant_Integration) (v3.0.0-beta.8 or later): installed and configured
    - Door and window sensors (binary sensors with the door, window, opening or garage door class).
    - The design-system templates: copy the four `ep_*.jinja` files from the repository's `custom_templates` folder into `config/custom_templates/`, then run `homeassistant.reload_custom_templates` (or restart Home Assistant). Update them together with the blueprints.
    - The design-system fonts in `/config/www/fonts/` (or another drawcustom font folder): `TRMNL12-Regular.ttf`, `TRMNL12-Bold.ttf`, `TRMNL16-Regular.ttf`, `TRMNL16-Bold.ttf`, `TRMNL21-Regular.ttf` and `TRMNL21-Bold.ttf` from the TRMNL font bundle (SIL OFL 1.1), and `SpaceGrotesk-Bold.ttf` (the static Bold file of Space Grotesk, SIL OFL 1.1).

    ## Trigger advice

    None to set: the page redraws only when the number of open doors and windows changes, when Home Assistant starts, or when you choose Run actions, so it costs almost no battery.

    ## Links

    - [E-paper design system repository](https://github.com/GuySie/epaper-design-system)
    - [E-paper design system](https://github.com/GuySie/epaper-design-system/blob/main/docs/design-system.md)
    - [TRMNL font bundle](https://trmnl.com/font-family)
    - [Space Grotesk (Google Fonts)](https://fonts.google.com/specimen/Space+Grotesk)
    - [OpenDisplay integration](https://github.com/OpenDisplay/Home_Assistant_Integration)
    - Made by [Guy Sie](https://github.com/guysie), with Claude
  source_url: https://github.com/GuySie/epaper-design-system/blob/main/blueprints/epaper-blueprint-1.4-doors-windows.yaml
  domain: automation
  input:
    display:
      name: Display and schedule
      icon: "mdi:monitor"
      input:
        displays:
          name: E-paper display(s)
          description: The 1.4" (200 x 200) devices to draw on
          selector:
            device:
              multiple: true
              filter:
                integration: opendisplay
        automation_conditions:
          name: Conditions
          description: Optional conditions that must be met to run the automation
          default: []
          selector:
            condition: null
    content:
      name: Content
      icon: "mdi:view-list"
      input:
        openings:
          name: Doors and windows
          description: The door and window sensors to watch. Pick only the ones that lead outside; fridge, mailbox or washing
            machine sensors don't belong here. The device redraws whenever the number of open ones changes.
          selector:
            entity:
              multiple: true
              filter:
              - domain: binary_sensor
                device_class: door
              - domain: binary_sensor
                device_class: window
              - domain: binary_sensor
                device_class: opening
              - domain: binary_sensor
                device_class: garage_door
    thresholds:
      name: Thresholds
      icon: "mdi:alert-outline"
      collapsed: true
      input:
        severe_openings:
          name: Doors that are severe when open
          description: Any open door or window is a warning (yellow chip). These ones are severe (red chip) when open, for
            example the front door. Leave empty for warnings only.
          default: []
          selector:
            entity:
              multiple: true
              filter:
              - domain: binary_sensor
    appearance:
      name: Appearance
      icon: "mdi:palette-outline"
      collapsed: true
      input:
        header_title:
          name: Header title
          description: Shown in capitals at the top left. Leave blank for "Open" in your language.
          default: ''
          selector:
            text: {}
        time_format:
          name: Time format
          description: 12-hour (AM/PM) or 24-hour clock for the times on the display.
          default: 24h
          selector:
            select:
              options:
              - label: 12-hour (AM/PM)
                value: 12h
              - label: 24-hour
                value: 24h
        weekday_format:
          name: Language
          description: 'Language of the texts on the display: titles, day and month names, messages.'
          default: en
          selector:
            select:
              options:
              - label: English
                value: en
              - label: German
                value: de
              - label: Dutch
                value: nl
              - label: French
                value: fr
              - label: Spanish
                value: es
              - label: Polish
                value: pl
              - label: Croatian
                value: hr
              - label: Swedish
                value: sv
        rotate:
          name: Rotation
          description: 'Display rotation in degrees. This panel is square (200 x 200): 0 draws this layout upright.'
          default: '0'
          selector:
            select:
              options:
              - label: '0'
                value: '0'
              - label: '90'
                value: '90'
              - label: '180'
                value: '180'
              - label: '270'
                value: '270'
    advanced:
      name: Advanced
      icon: "mdi:cog"
      collapsed: true
      input:
        font_dir:
          name: Font folder (optional)
          description: Leave empty when the design-system fonts (TRMNL12/16/21 Regular + Bold and SpaceGrotesk-Bold.ttf) are
            in one of drawcustom's font folders (/config/www/fonts, /config/media/fonts or /media/fonts). Otherwise give an
            absolute folder path ending in a slash, e.g. /config/fonts/
          default: ''
          selector:
            text: {}
trigger:
- trigger: state
  entity_id: !input 'openings'
  not_from:
  - unavailable
  - unknown
  not_to:
  - unavailable
  - unknown
- trigger: homeassistant
  event: start
  id: redraw
conditions: !input 'automation_conditions'
variables:
  ds_set: 'mdoixr'
  font_dir: !input 'font_dir'
  ds_devs: !input 'displays'
  weekday_lang: !input 'weekday_format'
  time_format: !input 'time_format'
  header_title: !input 'header_title'
  displays: !input 'displays'
  openings: !input 'openings'
  severe_openings: !input 'severe_openings'
  ds_otxt: |
    {% set m = {
      "en": {"title": "Open", "all": "All closed", "door": "door", "window": "window", "none": "No doors or windows selected"},
      "nl": {"title": "Open", "all": "Alles dicht", "door": "deur", "window": "raam", "none": "Geen deuren of ramen gekozen"},
      "de": {"title": "Offen", "all": "Alles zu", "door": "Tür", "window": "Fenster", "none": "Keine Türen oder Fenster gewählt"},
      "fr": {"title": "Ouvert", "all": "Tout fermé", "door": "porte", "window": "fenêtre", "none": "Aucune porte ou fenêtre choisie"},
      "es": {"title": "Abierto", "all": "Todo cerrado", "door": "puerta", "window": "ventana", "none": "Ninguna puerta o ventana elegida"},
      "pl": {"title": "Otwarte", "all": "Zamknięte", "door": "drzwi", "window": "okno", "none": "Nie wybrano drzwi ani okien"},
      "hr": {"title": "Otvoreno", "all": "Sve zatvoreno", "door": "vrata", "window": "prozor", "none": "Nisu odabrana vrata ni prozori"},
      "sv": {"title": "Öppet", "all": "Allt stängt", "door": "dörr", "window": "fönster", "none": "Inga dörrar eller fönster valda"}
    } %} {{ m[weekday_lang] if weekday_lang in m else m['en'] }}
  ds_open: |
    {% set ns = namespace(sev=[], warn=[]) %} {% for e in openings %}{% if is_state(e, 'on') %} {% set dc = state_attr(e, 'device_class') | default('', true) %} {% set nm = ((e ~ ' ' ~ (entity_name(e) or '') ~ ' ' ~ (device_name(e) or '')) | lower) %} {% set win = dc == 'window' or (dc != 'door' and ('window' in nm or 'raam' in nm or 'fenster' in nm)) %} {% set area = area_name(e) or e.split('.')[1].split('_')[0] %} {% set item = {'label': (area ~ ' ' ~ (ds_otxt['window'] if win else ds_otxt['door'])), 'area': area, 'win': win} %} {% if e in severe_openings %}{% set ns.sev = ns.sev + [item] %}{% else %}{% set ns.warn = ns.warn + [item] %}{% endif %} {% endif %}{% endfor %} {{ {'items': ns.sev + ns.warn, 'sev': ns.sev | count} }}
action:
- condition: template
  value_template: '{{ trigger.platform != ''state'' or trigger.from_state.state != trigger.to_state.state }}'
- choose:
  - conditions:
    - condition: template
      value_template: '{{ openings | count > 0 }}'
    sequence:
    - action: opendisplay.drawcustom
      target:
        device_id: !input 'displays'
      data:
        background: white
        dither: none
        rotate: !input 'rotate'
        payload: '{%- from ''ep_design.jinja'' import ep_draw -%} {{- (ep_draw | as_function)(''doors_windows_14'', ''main'',
          {''ds_set'': ds_set, ''ds_devs'': ds_devs, ''font_dir'': font_dir, ''ds_open'': ds_open, ''ds_otxt'': ds_otxt, ''header_title'':
          header_title, ''time_format'': time_format, ''weekday_lang'': weekday_lang}) -}}'
  default:
  - action: opendisplay.drawcustom
    target:
      device_id: !input 'displays'
    data:
      background: white
      dither: none
      rotate: !input 'rotate'
      payload: '{%- from ''ep_design.jinja'' import ep_draw -%} {{- (ep_draw | as_function)(''doors_windows_14'', ''error'',
        {''ds_set'': ds_set, ''ds_devs'': ds_devs, ''font_dir'': font_dir, ''ds_otxt'': ds_otxt, ''header_title'': header_title,
        ''time_format'': time_format, ''weekday_lang'': weekday_lang}) -}}'
mode: queued
max_exceeded: silent
max: 3

# Generated by lib/generate.py from pages/appointment.yaml: edit the page definition, not this file.
blueprint:
  name: E-paper Next appointment 3.5"
  description: |
    # E-paper Next appointment 3.5"

    Your next appointments: start time, title and a label line, a meeting in progress marked "now", and the next free moment in the footer. A single event gets its start time large.

    ## Works with

    3.5" (384 x 184) devices. Black and white, or with red, yellow or both.

    ## Needs

    - [OpenDisplay integration](https://github.com/OpenDisplay/Home_Assistant_Integration) (v3.0.0-beta.8 or later): installed and configured
    - [a calendar integration](https://www.home-assistant.io/integrations/#calendar): one or more calendars
    - The design-system templates: copy the four `ep_*.jinja` files from the repository's `custom_templates` folder into `config/custom_templates/`, then run `homeassistant.reload_custom_templates` (or restart Home Assistant). Update them together with the blueprints.
    - The design-system fonts in `/config/www/fonts/` (or another drawcustom font folder): `TRMNL12-Regular.ttf`, `TRMNL12-Bold.ttf`, `TRMNL16-Regular.ttf`, `TRMNL16-Bold.ttf`, `TRMNL21-Regular.ttf` and `TRMNL21-Bold.ttf` from the TRMNL font bundle (SIL OFL 1.1), and `SpaceGrotesk-Bold.ttf` (the static Bold file of Space Grotesk, SIL OFL 1.1).

    ## Trigger advice

    A time pattern every 15 minutes.

    You can add a device's button to the trigger (an "Entity event received" trigger on its `event.*` entity, e.g. `event.<your_device>_button_1`). A press then flashes that device's LED straight away, so you know it registered before the ~30 second redraw. Time-based and other triggers don't flash. If the flash fails, the display is still updated.

    ## Notes

    - All-day events are left out.

    ## Links

    - [E-paper design system repository](https://github.com/GuySie/epaper-design-system)
    - [E-paper design system](https://github.com/GuySie/epaper-design-system/blob/main/docs/design-system.md)
    - [TRMNL font bundle](https://trmnl.com/font-family)
    - [Space Grotesk (Google Fonts)](https://fonts.google.com/specimen/Space+Grotesk)
    - [OpenDisplay integration](https://github.com/OpenDisplay/Home_Assistant_Integration)
    - [a calendar integration](https://www.home-assistant.io/integrations/#calendar)
    - Made by [Guy Sie](https://github.com/guysie), with Claude
  source_url: https://github.com/GuySie/epaper-design-system/blob/main/blueprints/epaper-blueprint-3.5-next-appointment.yaml
  domain: automation
  input:
    display:
      name: Display and schedule
      icon: "mdi:monitor"
      input:
        displays:
          name: E-paper display(s)
          description: The 3.5" (384 x 184) devices to draw on
          selector:
            device:
              multiple: true
              filter:
                integration: opendisplay
        automation_trigger:
          name: Trigger
          description: When to trigger the automation
          selector:
            trigger: null
        automation_conditions:
          name: Conditions
          description: Optional conditions that must be met to run the automation
          default: []
          selector:
            condition: null
    content:
      name: Content
      icon: "mdi:view-list"
      input:
        calendar_entities:
          name: Calendar(s)
          description: One or more calendar entities to source events from. Events from multiple calendars are merged.
          selector:
            entity:
              multiple: true
              filter:
                domain: calendar
        days_ahead:
          name: Search window
          description: How many days ahead to search for upcoming appointments. Increase this if your calendar is sparse and
            the display isn't finding a second event.
          default: 7
          selector:
            number:
              min: 1
              max: 14
              mode: box
    appearance:
      name: Appearance
      icon: "mdi:palette-outline"
      collapsed: true
      input:
        header_title:
          name: Header title
          description: Shown in capitals at the top left. Leave blank for "Next Appointment" in your language.
          default: ''
          selector:
            text: {}
        time_format:
          name: Time format
          description: 12-hour (AM/PM) or 24-hour clock for the event times and the update time.
          default: 24h
          selector:
            select:
              options:
              - label: 12-hour (AM/PM)
                value: 12h
              - label: 24-hour
                value: 24h
        weekday_format:
          name: Language
          description: 'Language of the texts on the display: titles, day and month names, messages.'
          default: en
          selector:
            select:
              options:
              - label: English
                value: en
              - label: German
                value: de
              - label: Dutch
                value: nl
              - label: French
                value: fr
              - label: Spanish
                value: es
              - label: Polish
                value: pl
              - label: Croatian
                value: hr
              - label: Swedish
                value: sv
        rotate:
          name: Rotation
          description: 'Display rotation in degrees. This panel is natively portrait (184 x 384): 270 draws this layout upright,
            90 upside down.'
          default: '270'
          selector:
            select:
              options:
              - label: '0'
                value: '0'
              - label: '90'
                value: '90'
              - label: '180'
                value: '180'
              - label: '270'
                value: '270'
    advanced:
      name: Advanced
      icon: "mdi:cog"
      collapsed: true
      input:
        led_color:
          name: LED flash colour
          description: Colour of the confirmation flash when the update was triggered by a device button press.
          default:
          - 0
          - 255
          - 0
          selector:
            color_rgb: {}
        led_flash_delay:
          name: LED flash interval
          description: Time between the confirmation flashes.
          default: 500
          selector:
            number:
              min: 100
              max: 1500
              step: 100
              unit_of_measurement: ms
              mode: slider
        font_dir:
          name: Font folder (optional)
          description: Leave empty when the design-system fonts (TRMNL12/16/21 Regular + Bold and SpaceGrotesk-Bold.ttf) are
            in one of drawcustom's font folders (/config/www/fonts, /config/media/fonts or /media/fonts). Otherwise give an
            absolute folder path ending in a slash, e.g. /config/fonts/
          default: ''
          selector:
            text: {}
variables:
  ds_set: 'jpxwty'
  font_dir: !input 'font_dir'
  ds_devs: !input 'displays'
  weekday_lang: !input 'weekday_format'
  time_format: !input 'time_format'
  header_title: !input 'header_title'
  calendar_entities: !input 'calendar_entities'
  days_ahead: !input 'days_ahead'
  language_map: "{%- from 'ep_i18n.jinja' import EP_TXT -%}{{ EP_TXT['appointment'] }}"
  weekday_short_map: "{%- from 'ep_i18n.jinja' import EP_DAYS_SHORT -%}{{ EP_DAYS_SHORT }}"
  months_short_map: "{%- from 'ep_i18n.jinja' import EP_MONTHS_SHORT -%}{{ EP_MONTHS_SHORT }}"
  max_events: 4
  text_strip_pattern: '[^ -ɏ‐-‧‰-※€™]'
  header_title_display: '{{ header_title if header_title else language_map[weekday_lang][''default_title''] }}'
trigger: !input 'automation_trigger'
conditions: !input 'automation_conditions'
action:
- alias: 'Button feedback: flash the pressed device''s LED'
  if:
  - condition: template
    value_template: |-
      {{ trigger is defined and trigger.entity_id is defined and trigger.entity_id is string
         and trigger.entity_id.startswith('event.') and device_id(trigger.entity_id) is not none }}
  then:
  - action: opendisplay.activate_led
    continue_on_error: true
    data:
      device_id: '{{ device_id(trigger.entity_id) }}'
      color1: !input 'led_color'
      flash_count1: 2
      loop_delay1: !input 'led_flash_delay'
      brightness: 16
      repeats: 1
- choose:
  - conditions:
    - '{{ calendar_entities | count > 0 }}'
    sequence:
    - action: calendar.get_events
      target:
        entity_id: '{{ calendar_entities }}'
      data:
        start_date_time: '{{ today_at(''00:00'') }}'
        end_date_time: '{{ today_at(''00:00'') + timedelta(days=days_ahead) }}'
      response_variable: cal_events
    - variables:
        events_data: |
          {% set now_ts = now().timestamp() %} {% set today_date = now().date() %} {% set unsorted_events = (cal_events.values() | map(attribute='events') | list | sum(start=[])) | selectattr('start', 'search', ':') | list %} {% set tagged = namespace(list=[]) %} {% for e in unsorted_events %}
            {% set tagged.list = tagged.list + [{'ts': as_timestamp(e.start), 'event': e}] %}
          {% endfor %} {% set all_events = tagged.list | sort(attribute='ts') | map(attribute='event') | list %} {% set ns = namespace(list=[]) %} {% for e in all_events %}
            {% if (ns.list | count) < (max_events | int) and as_timestamp(e.end) > now_ts %}
              {% set start_local = as_local(as_datetime(e.start)) %}
              {% set is_current = as_timestamp(e.start) <= now_ts %}
              {% set day_diff = (start_local.date() - today_date).days %}
              {% if is_current %}
                {% set label = language_map[weekday_lang]['now_label'] %}
              {% elif day_diff == 0 %}
                {% set label = language_map[weekday_lang]['today'] %}
              {% elif day_diff == 1 %}
                {% set label = language_map[weekday_lang]['tomorrow'] %}
              {% else %}
                {% set label = weekday_short_map[weekday_lang][start_local.weekday()] ~ ' ' ~ start_local.day ~ ' ' ~ months_short_map[weekday_lang][start_local.month - 1] %}
              {% endif %}
              {% set start_label = (as_timestamp(e.start) | timestamp_custom('%-I:%M %p')) if time_format == '12h' else (as_timestamp(e.start) | timestamp_custom('%H:%M')) %}
              {% set end_label = (as_timestamp(e.end) | timestamp_custom('%-I:%M %p')) if time_format == '12h' else (as_timestamp(e.end) | timestamp_custom('%H:%M')) %}
              {% set ns.list = ns.list + [{
                'label': label,
                'is_current': is_current,
                'time_range': start_label ~ '–' ~ end_label,
                'start': start_label,
                'start_ts': as_timestamp(e.start),
                'end_ts': as_timestamp(e.end),
                'end': end_label,
                'summary': (e.summary | default('') | regex_replace(text_strip_pattern, '') | regex_replace(' {2,}', ' ') | trim)
              }] %}
            {% endif %}
          {% endfor %} {{ ns.list }}
    - action: opendisplay.drawcustom
      target:
        device_id: !input 'displays'
      data:
        background: white
        dither: none
        rotate: !input 'rotate'
        payload: '{%- from ''ep_design.jinja'' import ep_draw -%} {{- (ep_draw | as_function)(''appointment_35'', ''main'',
          {''ds_set'': ds_set, ''ds_devs'': ds_devs, ''font_dir'': font_dir, ''events_data'': events_data, ''header_title_display'':
          header_title_display, ''language_map'': language_map, ''time_format'': time_format, ''weekday_lang'': weekday_lang})
          -}}'
  default:
  - action: opendisplay.drawcustom
    target:
      device_id: !input 'displays'
    data:
      background: white
      dither: none
      rotate: !input 'rotate'
      payload: '{%- from ''ep_design.jinja'' import ep_draw -%} {{- (ep_draw | as_function)(''appointment_35'', ''error'',
        {''ds_set'': ds_set, ''ds_devs'': ds_devs, ''font_dir'': font_dir, ''header_title_display'': header_title_display,
        ''language_map'': language_map, ''time_format'': time_format, ''weekday_lang'': weekday_lang}) -}}'
mode: single
max_exceeded: silent

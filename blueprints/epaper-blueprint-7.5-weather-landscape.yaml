    weather_warning_sensor: !input 'weather_warning_sensor'
    weather_warning_text_sensor: !input 'weather_warning_text_sensor'
    pollen_type: !input 'pollen_type'
    start_with_today: !input 'start_with_today'
    flag_temp_low: !input 'flag_temp_low'
    warning_temp_low: !input 'warning_temp_low'
    severe_temp_low: !input 'severe_temp_low'
    flag_temp_high: !input 'flag_temp_high'
    warning_temp_high: !input 'warning_temp_high'
    severe_temp_high: !input 'severe_temp_high'
    flag_wind_high: !input 'flag_wind_high'
    warning_wind_high: !input 'warning_wind_high'
    severe_wind_high: !input 'severe_wind_high'
    flag_rain_hour: !input 'flag_rain_hour'
    warning_rain_hour: !input 'warning_rain_hour'
    severe_rain_hour: !input 'severe_rain_hour'
    flag_rain_day: !input 'flag_rain_day'
    warning_rain_day: !input 'warning_rain_day'
    severe_rain_day: !input 'severe_rain_day'
    flag_pollen_high: !input 'flag_pollen_high'
    warning_pollen_high: !input 'warning_pollen_high'
    severe_pollen_high: !input 'severe_pollen_high'
    warning_conditions: !input 'warning_conditions'
    severe_conditions: !input 'severe_conditions'
    location_string: !input 'location_string'
  weather_entity: !input 'weather_entity'
  forecast_entity: |-
    {% if weather_entity and states(weather_entity) not in ['unknown', 'unavailable'] %}
      {{ weather_entity }}
    {% else %}
      {{ (states | selectattr('domain','equalto','weather') | rejectattr('state','in',['unknown','unavailable']) | list | first).entity_id if states | selectattr('domain','equalto','weather') | rejectattr('state','in',['unknown','unavailable']) | list else 'unavailable' }}
    {% endif %}
trigger: !input 'automation_trigger'
conditions: !input 'automation_conditions'
action:
- alias: 'Button feedback: flash the pressed device''s LED'
  if:
  - condition: template
    value_template: |-
      {{ trigger is defined and trigger.entity_id is defined and trigger.entity_id is string
         and trigger.entity_id.startswith('event.') and device_id(trigger.entity_id) is not none }}
  then:
  - action: opendisplay.activate_led
    continue_on_error: true
    data:
      device_id: '{{ device_id(trigger.entity_id) }}'
      color1: !input 'led_color'
      flash_count1: 2
      loop_delay1: !input 'led_flash_delay'
      brightness: 16
      repeats: 1
- if:
  - '{{ forecast_entity != ''unavailable'' }}'
  then:
  - action: weather.get_forecasts
    target:
      entity_id: '{{ forecast_entity }}'
    data:
      type: daily
    response_variable: ds_fd
  - if:
    - '{{ (state_attr(forecast_entity, ''supported_features'') | int(0)) | bitwise_and(2) > 0 }}'
    then:
    - action: weather.get_forecasts
      target:
        entity_id: '{{ forecast_entity }}'
      data:
        type: hourly
      response_variable: ds_fh
- action: opendisplay.drawcustom
  target:
    device_id: !input 'displays'
  data:
    background: white
    dither: none
    rotate: !input 'rotate'
    payload: |-
      {%- from 'ep_design.jinja' import ep_draw -%} {{- (ep_draw | as_function)('weather_75', 'main' if forecast_entity != 'unavailable' else 'error',
            dict(ds_in, ds_set=ds_set, forecast_entity=forecast_entity, ds_fd=ds_fd | default({}), ds_fh=ds_fh | default({}))) -}}
mode: single
max_exceeded: silent

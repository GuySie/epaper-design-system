          selector:
            trigger: null
        automation_conditions:
          name: Conditions
          description: Optional conditions that must be met to run the automation
          default: []
          selector:
            condition: null
    content:
      name: Content
      icon: "mdi:view-list"
      input:
        weather_entity:
          name: Weather entity
          description: The weather entity to show. While it isn't working, another working weather entity is used instead.
            Must support the daily forecast type.
          selector:
            entity:
              filter:
                domain: weather
        current_temp_sensor:
          name: Current temperature sensor
          description: Optional temperature sensor to use instead of forecast temperature
          default: ''
          selector:
            entity:
              filter:
                domain: sensor
                device_class: temperature
        pollen_sensor:
          name: Pollen forecast sensor
          description: Optional Kleenex pollen sensor to use - if not specified an additional hour weather forecast will be

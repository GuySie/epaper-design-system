          description: The 3.5" (384 x 184) devices to draw on
          selector:
            device:
              multiple: true
              filter:
                integration: opendisplay
        automation_trigger:
          name: Trigger
          description: When to trigger the automation
          selector:
            trigger: null
        automation_conditions:
          name: Conditions
          description: Optional conditions that must be met to run the automation
          default: []
          selector:
            condition: null
    content:
      name: Content
      icon: "mdi:view-list"
      input:
        co2_entity:
          name: CO2 sensor
          description: The CO2 sensor to graph (ppm, with long-term statistics)
          selector:
            entity:
              filter:
                domain: sensor
                device_class: carbon_dioxide
        hours:
          name: Time span
          description: How much history the graph shows
          default: '12'
          selector:
            select:
              options:
              - label: 3 hours
                value: '3'
              - label: 6 hours
                value: '6'
              - label: 12 hours
                value: '12'
              - label: 24 hours
                value: '24'
    thresholds:
      name: Thresholds
      icon: "mdi:alert-outline"
      collapsed: true
      input:
        flag_co2:
          name: 'CO2: flag it'
          description: Off, nothing is flagged and the graph shows no threshold lines. The severe value below still sets the
            height of the graph.
          default: true
          selector:
            boolean: {}
        warning_co2:
          name: 'CO2: warning at or above'
          description: CO2 level drawn as the lower dashed line. Spans above it are filled yellow on BWRY panels, and the
            summary line turns into a warning chip.
          default: 1000
          selector:
            number:
              min: 400
              max: 5000
              step: 50
              unit_of_measurement: ppm
              mode: box
        severe_co2:
          name: 'CO2: severe at or above'
          description: CO2 level drawn as the upper dashed line. Spans above it are filled in the severe colour, and the summary
            line turns into a severe chip. The graph runs from 400 ppm (outdoor air) up to 1.5 x this value.
          default: 1400
          selector:
            number:
              min: 400
              max: 5000
              step: 50
              unit_of_measurement: ppm
              mode: box
    appearance:
      name: Appearance
      icon: "mdi:palette-outline"
      collapsed: true
      input:
        header_title:
          name: Header title
          description: Shown in capitals at the top left. Leave blank for "CO2" plus the sensor's area in your language.
          default: ''
          selector:
            text: {}
        time_format:
          name: Time format
          description: 12-hour (AM/PM) or 24-hour clock for the times on the display.
          default: 24h
          selector:
            select:
              options:
              - label: 12-hour (AM/PM)
                value: 12h
              - label: 24-hour
                value: 24h
        weekday_format:
          name: Language
          description: 'Language of the texts on the display: titles, day and month names, messages.'
          default: en
          selector:
            select:
              options:
              - label: English
                value: en
              - label: German
                value: de
              - label: Dutch
                value: nl
              - label: French
                value: fr
              - label: Spanish
                value: es
              - label: Polish
                value: pl
              - label: Croatian
                value: hr
              - label: Swedish
                value: sv
        rotate:
          name: Rotation
          description: 'Display rotation in degrees. This panel is natively portrait (184 x 384): 270 draws this layout upright,
            90 upside down.'
          default: '270'
          selector:
            select:
              options:
              - label: '0'
                value: '0'
              - label: '90'
                value: '90'
              - label: '180'
                value: '180'
              - label: '270'
                value: '270'
    advanced:
      name: Advanced
      icon: "mdi:cog"
      collapsed: true
      input:
        stale_after:
          name: Mark data as stale after
          description: When the source hasn't reported data for this many minutes (even an unchanged value counts as a report),
            the timestamp in the title row shows the time of the last update in a black chip with "!". 0 turns this off.
          default: 60
          selector:
            number:
              min: 0
              max: 1440
              unit_of_measurement: min
              mode: box
        led_color:
          name: LED flash colour
          description: Colour of the confirmation flash when the update was triggered by a device button press.
          default:
          - 0
          - 255
          - 0
          selector:
            color_rgb: {}
        led_flash_delay:
          name: LED flash interval
          description: Time between the confirmation flashes.
          default: 500
          selector:
            number:
              min: 100
              max: 1500
              step: 100
              unit_of_measurement: ms
              mode: slider
        font_dir:
          name: Font folder (optional)
          description: Leave empty when the design-system fonts (TRMNL12/16/21 Regular + Bold and SpaceGrotesk-Bold.ttf) are
            in one of drawcustom's font folders (/config/www/fonts, /config/media/fonts or /media/fonts). Otherwise give an
            absolute folder path ending in a slash, e.g. /config/fonts/
          default: ''
          selector:
            text: {}
variables:
  ds_set: 'efonpx'
  font_dir: !input 'font_dir'
  ds_devs: !input 'displays'
  stale_after: !input 'stale_after'
  weekday_lang: !input 'weekday_format'
  time_format: !input 'time_format'
  header_title: !input 'header_title'
  co2_entity: !input 'co2_entity'
  hours: !input 'hours'
  flag_co2: !input 'flag_co2'
  warning_co2: !input 'warning_co2'
  severe_co2: !input 'severe_co2'
  language_map: "{%- from 'ep_i18n.jinja' import EP_TXT -%}{{ EP_TXT['co2'] }}"
  ds_title: '{% set a = area_name(co2_entity) if co2_entity else none %} {{ header_title if header_title else (language_map[weekday_lang][''default_title'']
    ~ (('' · '' ~ a) if a else '''')) }}'
  ds_last_ts: |-
    {% set ns = namespace(t=0) %} {% for e in [co2_entity] %}
      {% if e %}{% for s in expand(e) %}{% set ns.t = [ns.t, as_timestamp(s.last_reported | default(s.last_updated), 0)] | max %}{% endfor %}{% endif %}
    {% endfor %} {{ ns.t }}
  ds_stale: '{{ (stale_after | int(0)) > 0 and (ds_last_ts | float(0)) > 0 and (as_timestamp(now()) - (ds_last_ts | float(0)))
    > (stale_after | int(0)) * 60 }}'
trigger: !input 'automation_trigger'
conditions: !input 'automation_conditions'
action:
- alias: 'Button feedback: flash the pressed device''s LED'
  if:
  - condition: template
    value_template: |-
      {{ trigger is defined and trigger.entity_id is defined and trigger.entity_id is string
         and trigger.entity_id.startswith('event.') and device_id(trigger.entity_id) is not none }}
  then:
  - action: opendisplay.activate_led
    continue_on_error: true
    data:
      device_id: '{{ device_id(trigger.entity_id) }}'
      color1: !input 'led_color'
      flash_count1: 2
      loop_delay1: !input 'led_flash_delay'
      brightness: 16
      repeats: 1
- action: recorder.get_statistics
  continue_on_error: true
  data:
    statistic_ids:
    - '{{ co2_entity }}'
    start_time: '{{ (now() - timedelta(hours=hours | int(12))).strftime(''%Y-%m-%d %H:%M:%S'') }}'
    period: 5minute
    types:
    - mean
    - max
  response_variable: co2_stats
- variables:
    ds_t1: '{{ as_timestamp(now()) }}'
    ds_t0: '{{ as_timestamp(now()) - (hours | int(12)) * 3600 }}'
    ds_bucket: '{{ [((hours | int(12)) * 12 / 160) | round(0, ''ceil'') | int, 1] | max }}'
    ds_pts: |
      {% set st = co2_stats.statistics if (co2_stats is defined and co2_stats is mapping and co2_stats.statistics is defined) else {} %} {% set raw = (st[co2_entity] if co2_entity in st else []) | selectattr('mean', 'defined') | list %} {% set ns = namespace(list=[]) %} {% for g in raw | batch(ds_bucket | int(1)) %}
        {% set vals = g | map(attribute='mean') | reject('none') | list %}
        {% set mxs = g | map(attribute='max') | reject('none') | list %}
        {% if vals | length > 0 %}
          {% set ts = ((as_timestamp(g[0].start) + as_timestamp(g[-1].end)) / 2) %}
          {% set ns.list = ns.list + [{'ts': ts, 'v': (vals | sum) / (vals | length), 'mx': (mxs | max) if mxs else (vals | max)}] %}
        {% endif %}
      {% endfor %} {% set cur = states(co2_entity) | float(none) %} {% if cur is not none and (ns.list | length) > 0 %}
        {% set ns.list = ns.list + [{'ts': as_timestamp(now()), 'v': cur, 'mx': cur}] %}
      {% endif %} {{ ns.list }}
- choose:
  - conditions:
    - '{{ ds_pts | length >= 2 }}'
    sequence:
    - action: opendisplay.drawcustom
      target:
        device_id: !input 'displays'
      data:
        background: white
        dither: none
        rotate: !input 'rotate'
        payload: '{%- from ''ep_design.jinja'' import ep_draw -%} {{- (ep_draw | as_function)(''co2_35'', ''main'', {''ds_set'':
          ds_set, ''ds_devs'': ds_devs, ''font_dir'': font_dir, ''ds_bucket'': ds_bucket, ''ds_last_ts'': ds_last_ts, ''ds_pts'':
          ds_pts, ''ds_stale'': ds_stale, ''ds_t0'': ds_t0, ''ds_t1'': ds_t1, ''ds_title'': ds_title, ''flag_co2'': flag_co2,
          ''language_map'': language_map, ''severe_co2'': severe_co2, ''time_format'': time_format, ''warning_co2'': warning_co2,
          ''weekday_lang'': weekday_lang}) -}}'
  default:
  - action: opendisplay.drawcustom
    target:
      device_id: !input 'displays'
    data:
      background: white
      dither: none
      rotate: !input 'rotate'
      payload: '{%- from ''ep_design.jinja'' import ep_draw -%} {{- (ep_draw | as_function)(''co2_35'', ''error'', {''ds_set'':
        ds_set, ''ds_devs'': ds_devs, ''font_dir'': font_dir, ''ds_title'': ds_title, ''language_map'': language_map, ''time_format'':
        time_format, ''weekday_lang'': weekday_lang}) -}}'
mode: single
max_exceeded: silent

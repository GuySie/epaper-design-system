# Generated by lib/generate.py from pages/calendar.yaml: edit the page definition, not this file.
blueprint:
  name: E-paper Calendar 4.1"
  description: |
    # E-paper Calendar 4.1"

    The coming days, each under its day header with its events, today first; later days fold into one line when they don't fit.

    ## Works with

    4.1" (400 x 300) devices. Black and white, or with red, yellow or both.

    ## Needs

    - [OpenDisplay integration](https://github.com/OpenDisplay/Home_Assistant_Integration) (v3.0.0-beta.8 or later): installed and configured
    - [a calendar integration](https://www.home-assistant.io/integrations/#calendar): one or more calendars
    - The design-system templates: copy the four `ep_*.jinja` files from the repository's `custom_templates` folder into `config/custom_templates/`, then run `homeassistant.reload_custom_templates` (or restart Home Assistant). Update them together with the blueprints.
    - The design-system fonts in `/config/www/fonts/` (or another drawcustom font folder): `TRMNL12-Regular.ttf`, `TRMNL12-Bold.ttf`, `TRMNL16-Regular.ttf`, `TRMNL16-Bold.ttf`, `TRMNL21-Regular.ttf` and `TRMNL21-Bold.ttf` from the TRMNL font bundle (SIL OFL 1.1), and `SpaceGrotesk-Bold.ttf` (the static Bold file of Space Grotesk, SIL OFL 1.1).

    ## Trigger advice

    A time pattern every hour.

    You can add a device's button to the trigger (an "Entity event received" trigger on its `event.*` entity, e.g. `event.<your_device>_button_1`). A press then flashes that device's LED straight away, so you know it registered before the ~30 second redraw. Time-based and other triggers don't flash. If the flash fails, the display is still updated.

    ## Links

    - [E-paper design system repository](https://github.com/GuySie/epaper-design-system)
    - [E-paper design system](https://github.com/GuySie/epaper-design-system/blob/main/docs/design-system.md)
    - [TRMNL font bundle](https://trmnl.com/font-family)
    - [Space Grotesk (Google Fonts)](https://fonts.google.com/specimen/Space+Grotesk)
    - [OpenDisplay integration](https://github.com/OpenDisplay/Home_Assistant_Integration)
    - [a calendar integration](https://www.home-assistant.io/integrations/#calendar)
    - Inspired by: [calendar automation by svenove](https://github.com/svenove/OpenEPaperLink-HA-Calendar)
    - Made by [Guy Sie](https://github.com/guysie), with Claude
  source_url: https://github.com/GuySie/epaper-design-system/blob/main/blueprints/epaper-blueprint-4.1-calendar.yaml
  domain: automation
  input:
    display:
      name: Display and schedule
      icon: "mdi:monitor"
      input:
        displays:
          name: E-paper display(s)
          description: The 4.1" (400 x 300) devices to draw on
          selector:
            device:
              multiple: true
              filter:
                integration: opendisplay
        automation_trigger:
          name: Trigger
          description: When to trigger the automation
          selector:
            trigger: null
        automation_conditions:
          name: Conditions
          description: Optional conditions that must be met to run the automation
          default: []
          selector:
            condition: null
    content:
      name: Content
      icon: "mdi:view-list"
      input:
        calendar_entities:
          name: Calendar(s)
          description: One or more calendar entities to source events from. Events from multiple calendars are merged into
            a single agenda.
          selector:
            entity:
              multiple: true
              filter:
                domain: calendar
        days_shown:
          name: Days shown
          description: How many days ahead to display, starting today. With many days and/or busy calendars, content may overflow
            the display's 300px height.
          default: 6
          selector:
            number:
              min: 1
              max: 7
              mode: box
    appearance:
      name: Appearance
      icon: "mdi:palette-outline"
      collapsed: true
      input:
        header_title:
          name: Header title
          description: Shown in capitals at the top left. Leave blank for "Agenda" in your language.
          default: ''
          selector:
            text: {}
        time_format:
          name: Time format
          description: 12-hour (AM/PM) or 24-hour clock for the event times and the update time.
          default: 24h
          selector:
            select:
              options:
              - label: 12-hour (AM/PM)
                value: 12h
              - label: 24-hour
                value: 24h
        weekday_format:
          name: Language
          description: 'Language of the texts on the display: titles, day and month names, messages.'
          default: en
          selector:
            select:
              options:
              - label: English
                value: en
              - label: German
                value: de
              - label: Dutch
                value: nl
              - label: French
                value: fr
              - label: Spanish
                value: es
              - label: Polish
                value: pl
              - label: Croatian
                value: hr
              - label: Swedish
                value: sv
        rotate:
          name: Rotation
          description: 'Display rotation in degrees. This panel is natively landscape (400 x 300): 0 draws this layout upright,
            180 upside down.'
          default: '0'
          selector:
            select:
              options:
              - label: '0'
                value: '0'
              - label: '90'
                value: '90'
              - label: '180'
                value: '180'
              - label: '270'
                value: '270'
    advanced:
      name: Advanced
      icon: "mdi:cog"
      collapsed: true
      input:
        led_color:
          name: LED flash colour
          description: Colour of the confirmation flash when the update was triggered by a device button press.
          default:
          - 0
          - 255
          - 0
          selector:
            color_rgb: {}
        led_flash_delay:
          name: LED flash interval
          description: Time between the confirmation flashes.
          default: 500
          selector:
            number:
              min: 100
              max: 1500
              step: 100
              unit_of_measurement: ms
              mode: slider
        font_dir:
          name: Font folder (optional)
          description: Leave empty when the design-system fonts (TRMNL12/16/21 Regular + Bold and SpaceGrotesk-Bold.ttf) are
            in one of drawcustom's font folders (/config/www/fonts, /config/media/fonts or /media/fonts). Otherwise give an
            absolute folder path ending in a slash, e.g. /config/fonts/
          default: ''
          selector:
            text: {}
variables:
  ds_set: 'qtekll'
  font_dir: !input 'font_dir'
  ds_devs: !input 'displays'
  weekday_lang: !input 'weekday_format'
  time_format: !input 'time_format'
  header_title: !input 'header_title'
  calendar_entities: !input 'calendar_entities'
  days_shown: !input 'days_shown'
  language_map: "{%- from 'ep_i18n.jinja' import EP_TXT -%}{{ EP_TXT['calendar'] }}"
  weekday_short_map: "{%- from 'ep_i18n.jinja' import EP_DAYS_SHORT -%}{{ EP_DAYS_SHORT }}"
  months_short_map: "{%- from 'ep_i18n.jinja' import EP_MONTHS_SHORT -%}{{ EP_MONTHS_SHORT }}"
  text_strip_pattern: '[^ -ɏ‐-‧‰-※€™]'
  header_title_display: '{{ header_title if header_title else language_map[weekday_lang][''title''] }}'
trigger: !input 'automation_trigger'
conditions: !input 'automation_conditions'
action:
- alias: 'Button feedback: flash the pressed device''s LED'
  if:
  - condition: template
    value_template: |-
      {{ trigger is defined and trigger.entity_id is defined and trigger.entity_id is string
         and trigger.entity_id.startswith('event.') and device_id(trigger.entity_id) is not none }}
  then:
  - action: opendisplay.activate_led
    continue_on_error: true
    data:
      device_id: '{{ device_id(trigger.entity_id) }}'
      color1: !input 'led_color'
      flash_count1: 2
      loop_delay1: !input 'led_flash_delay'
      brightness: 16
      repeats: 1
- choose:
  - conditions:
    - '{{ calendar_entities | count > 0 }}'
    sequence:
    - action: calendar.get_events
      target:
        entity_id: '{{ calendar_entities }}'
      data:
        start_date_time: '{{ today_at(''00:00'') }}'
        end_date_time: '{{ today_at(''00:00'') + timedelta(days=days_shown) }}'
      response_variable: cal_events
    - variables:
        all_events: |
          {{ (cal_events.values() | map(attribute='events') | list | sum(start=[])) | sort(attribute='start') }}
        days: |
          {% set ns = namespace(list=[], prior=0) %} {% for i in range(days_shown | int) %}
            {% set day_date = today_at('00:00') + timedelta(days=i) %}
            {% set day_key = day_date.strftime('%Y-%m-%d') %}
            {% set day_ns = namespace(raw=[], matched=0) %}
            {% for event in all_events %}
              {% if (as_timestamp(event.start) | timestamp_custom('%Y-%m-%d')) == day_key %}
                {% set day_ns.matched = day_ns.matched + 1 %}
                {% if (as_timestamp(event.start) | timestamp_custom('%H:%M')) == '00:00' %}
                  {% set line = {'time': '', 'text': language_map[weekday_lang]['all_day_prefix'] ~ (event.summary | default('') | regex_replace(text_strip_pattern, '') | regex_replace(' {2,}', ' ') | trim)} %}
                {% else %}
                  {% set start_label = (as_timestamp(event.start) | timestamp_custom('%-I:%M %p')) if time_format == '12h' else (as_timestamp(event.start) | timestamp_custom('%H:%M')) %}
                  {% set end_label = (as_timestamp(event.end) | timestamp_custom('%-I:%M %p')) if time_format == '12h' else (as_timestamp(event.end) | timestamp_custom('%H:%M')) %}
                  {% set line = {'start_ts': as_timestamp(event.start), 'end_ts': as_timestamp(event.end), 'time': start_label, 'text': (event.summary | default('') | regex_replace(text_strip_pattern, '') | regex_replace(' {2,}', ' ') | trim)} %}
                {% endif %}
                {% set day_ns.raw = day_ns.raw + [{'ts': as_timestamp(event.start), 'line': line}] %}
              {% endif %}
            {% endfor %}
            {% set count = day_ns.matched if day_ns.matched > 0 else 1 %}
            {% set event_lines = (day_ns.raw | sort(attribute='ts') | map(attribute='line') | list) if day_ns.matched > 0 else [{'time': '', 'text': language_map[weekday_lang]['no_events']}] %}
            {% set ns.list = ns.list + [{
              'weekday': language_map[weekday_lang]['weekdays'][day_date.weekday()],
              'day_num': day_date.day,
              'month': language_map[weekday_lang]['months'][day_date.month - 1],
              'is_today': i == 0,
              'event_lines': event_lines
            }] %}
            {% set ns.prior = ns.prior + count %}
          {% endfor %} {{ ns.list }}
    - action: opendisplay.drawcustom
      target:
        device_id: !input 'displays'
      data:
        background: white
        dither: none
        rotate: !input 'rotate'
        payload: '{%- from ''ep_design.jinja'' import ep_draw -%} {{- (ep_draw | as_function)(''calendar_41'', ''main'', {''ds_set'':
          ds_set, ''ds_devs'': ds_devs, ''font_dir'': font_dir, ''days'': days, ''header_title_display'': header_title_display,
          ''language_map'': language_map, ''months_short_map'': months_short_map, ''time_format'': time_format, ''weekday_lang'':
          weekday_lang, ''weekday_short_map'': weekday_short_map}) -}}'
  default:
  - action: opendisplay.drawcustom
    target:
      device_id: !input 'displays'
    data:
      background: white
      dither: none
      rotate: !input 'rotate'
      payload: '{%- from ''ep_design.jinja'' import ep_draw -%} {{- (ep_draw | as_function)(''calendar_41'', ''error'', {''ds_set'':
        ds_set, ''ds_devs'': ds_devs, ''font_dir'': font_dir, ''header_title_display'': header_title_display, ''language_map'':
        language_map, ''time_format'': time_format, ''weekday_lang'': weekday_lang}) -}}'
mode: single
max_exceeded: silent

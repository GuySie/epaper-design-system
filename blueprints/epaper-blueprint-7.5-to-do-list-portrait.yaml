# Generated by lib/generate.py from pages/todo.yaml: edit the page definition, not this file.
blueprint:
  name: E-paper To-do list 7.5" portrait
  description: |
    # E-paper To-do list 7.5" portrait

    A to-do list: the open items first, each with its box and its due day, then the done ones while there is room. An overdue item and one due today are flagged.

    ## Works with

    7.5" (480 x 800) devices held portrait. Black and white, grayscale, or with red, yellow or both.

    ## Needs

    - [OpenDisplay integration](https://github.com/OpenDisplay/Home_Assistant_Integration) (v3.0.0-beta.8 or later): installed and configured
    - A to-do list (any to-do entity).
    - The design-system templates: copy the four `ep_*.jinja` files from the repository's `custom_templates` folder into `config/custom_templates/`, then run `homeassistant.reload_custom_templates` (or restart Home Assistant). Update them together with the blueprints.
    - The design-system fonts in `/config/www/fonts/` (or another drawcustom font folder): `TRMNL12-Regular.ttf`, `TRMNL12-Bold.ttf`, `TRMNL16-Regular.ttf`, `TRMNL16-Bold.ttf`, `TRMNL21-Regular.ttf` and `TRMNL21-Bold.ttf` from the TRMNL font bundle (SIL OFL 1.1), and `SpaceGrotesk-Bold.ttf` (the static Bold file of Space Grotesk, SIL OFL 1.1).

    ## Trigger advice

    A state trigger on the list (its state is the number of open items), and a time pattern once a day so the due days stay right.

    You can add a device's button to the trigger (an "Entity event received" trigger on its `event.*` entity, e.g. `event.<your_device>_button_1`). A press then flashes that device's LED straight away, so you know it registered before the ~30 second redraw. Time-based and other triggers don't flash. If the flash fails, the display is still updated.

    ## Links

    - [E-paper design system repository](https://github.com/GuySie/epaper-design-system)
    - [E-paper design system](https://github.com/GuySie/epaper-design-system/blob/main/docs/design-system.md)
    - [TRMNL font bundle](https://trmnl.com/font-family)
    - [Space Grotesk (Google Fonts)](https://fonts.google.com/specimen/Space+Grotesk)
    - [OpenDisplay integration](https://github.com/OpenDisplay/Home_Assistant_Integration)
    - Made by [Guy Sie](https://github.com/guysie), with Claude
  source_url: https://github.com/GuySie/epaper-design-system/blob/main/blueprints/epaper-blueprint-7.5-to-do-list-portrait.yaml
  domain: automation
  input:
    display:
      name: Display and schedule
      icon: "mdi:monitor"
      input:
        displays:
          name: E-paper display(s)
          description: The 7.5" (480 x 800) devices to draw on
          selector:
            device:
              multiple: true
              filter:
                integration: opendisplay
        automation_trigger:
          name: Trigger
          description: When to trigger the automation
          selector:
            trigger: null
        automation_conditions:
          name: Conditions
          description: Optional conditions that must be met to run the automation
          default: []
          selector:
            condition: null
    content:
      name: Content
      icon: "mdi:view-list"
      input:
        todo_entity:
          name: To-do list
          description: The list whose items are shown.
          selector:
            entity:
              filter:
                domain: todo
        show_done:
          name: Show done items
          description: On, the done items follow the open ones while there is room. Off, only the open items are shown.
          default: true
          selector:
            boolean: {}
        due_first:
          name: Due days first
          description: On, the items with a due day come first, the earliest first. Off, the items keep the order the list
            has.
          default: false
          selector:
            boolean: {}
    thresholds:
      name: Thresholds
      icon: "mdi:alert-outline"
      collapsed: true
      input:
        flag_due:
          name: 'Due day: flag it'
          description: On, an overdue item is severe and an item due today is a warning.
          default: true
          selector:
            boolean: {}
    appearance:
      name: Appearance
      icon: "mdi:palette-outline"
      collapsed: true
      input:
        header_title:
          name: Header title
          description: Shown in capitals at the top left. Leave blank for the list's name in your language.
          default: ''
          selector:
            text: {}
        time_format:
          name: Time format
          description: 12-hour (AM/PM) or 24-hour clock for the times on the display.
          default: 24h
          selector:
            select:
              options:
              - label: 12-hour (AM/PM)
                value: 12h
              - label: 24-hour
                value: 24h
        weekday_format:
          name: Language
          description: 'Language of the texts on the display: titles, day and month names, messages.'
          default: en
          selector:
            select:
              options:
              - label: English
                value: en
              - label: German
                value: de
              - label: Dutch
                value: nl
              - label: French
                value: fr
              - label: Spanish
                value: es
              - label: Polish
                value: pl
              - label: Croatian
                value: hr
              - label: Swedish
                value: sv
        rotate:
          name: Rotation
          description: 'Display rotation in degrees. This panel is natively landscape (800 x 480): 270 draws this layout upright,
            90 upside down.'
          default: '270'
          selector:
            select:
              options:
              - label: '0'
                value: '0'
              - label: '90'
                value: '90'
              - label: '180'
                value: '180'
              - label: '270'
                value: '270'
    advanced:
      name: Advanced
      icon: "mdi:cog"
      collapsed: true
      input:
        led_color:
          name: LED flash colour
          description: Colour of the confirmation flash when the update was triggered by a device button press.
          default:
          - 0
          - 255
          - 0
          selector:
            color_rgb: {}
        led_flash_delay:
          name: LED flash interval
          description: Time between the confirmation flashes.
          default: 500
          selector:
            number:
              min: 100
              max: 1500
              step: 100
              unit_of_measurement: ms
              mode: slider
        font_dir:
          name: Font folder (optional)
          description: Leave empty when the design-system fonts (TRMNL12/16/21 Regular + Bold and SpaceGrotesk-Bold.ttf) are
            in one of drawcustom's font folders (/config/www/fonts, /config/media/fonts or /media/fonts). Otherwise give an
            absolute folder path ending in a slash, e.g. /config/fonts/
          default: ''
          selector:
            text: {}
variables:
  ds_set: 'jpxwty'
  font_dir: !input 'font_dir'
  ds_devs: !input 'displays'
  weekday_lang: !input 'weekday_format'
  time_format: !input 'time_format'
  header_title: !input 'header_title'
  todo_entity: !input 'todo_entity'
  show_done: !input 'show_done'
  due_first: !input 'due_first'
  flag_due: !input 'flag_due'
  language_map: "{%- from 'ep_i18n.jinja' import EP_TXT -%}{{ EP_TXT['todo'] }}"
  ds_title: '{{ header_title if header_title else (entity_name(todo_entity) or device_name(todo_entity) or todo_entity) }}'
trigger: !input 'automation_trigger'
conditions: !input 'automation_conditions'
action:
- alias: 'Button feedback: flash the pressed device''s LED'
  if:
  - condition: template
    value_template: |-
      {{ trigger is defined and trigger.entity_id is defined and trigger.entity_id is string
         and trigger.entity_id.startswith('event.') and device_id(trigger.entity_id) is not none }}
  then:
  - action: opendisplay.activate_led
    continue_on_error: true
    data:
      device_id: '{{ device_id(trigger.entity_id) }}'
      color1: !input 'led_color'
      flash_count1: 2
      loop_delay1: !input 'led_flash_delay'
      brightness: 16
      repeats: 1
- action: todo.get_items
  continue_on_error: true
  target:
    entity_id: '{{ todo_entity }}'
  data:
    status:
    - needs_action
    - completed
  response_variable: todo_items
- variables:
    ds_todo: |
      {% set r = todo_items[todo_entity]['items'] if (todo_items is defined and todo_items is mapping and todo_entity in todo_items) else [] %} {% set today = strptime(now().strftime('%Y-%m-%d'), '%Y-%m-%d') %} {% set ns = namespace(o=[], d=[]) %} {% for it in r %}
        {% set due = ((it.due | string)[:10]) if (it.due is defined and it.due) else '' %}
        {% if it.status == 'completed' %}
          {% set ns.d = ns.d + [{'s': it.summary | string, 'n': '', 'k': 99999, 'lv': ''}] %}
        {% elif due %}
          {% set dd = strptime(due, '%Y-%m-%d') %} {% set n = (dd - today).days %}
          {% set ns.o = ns.o + [{'s': it.summary | string, 'n': n, 'k': n, 'wd': dd.weekday(), 'day': dd.day, 'mon': dd.month, 'lv': (('sev' if n < 0 else ('warn' if n == 0 else '')) if flag_due else '')}] %}
        {% else %}
          {% set ns.o = ns.o + [{'s': it.summary | string, 'n': '', 'k': 99999, 'lv': ''}] %}
        {% endif %}
      {% endfor %} {{ {'open': (ns.o | sort(attribute='k')) if due_first else ns.o, 'done': ns.d if show_done else [], 'n_open': ns.o | length, 'n_done': ns.d | length, 'counted': show_done} }}
- choose:
  - conditions:
    - '{{ states(todo_entity) not in [''unknown'', ''unavailable''] }}'
    sequence:
    - action: opendisplay.drawcustom
      target:
        device_id: !input 'displays'
      data:
        background: white
        dither: none
        rotate: !input 'rotate'
        payload: '{%- from ''ep_design.jinja'' import ep_draw -%} {{- (ep_draw | as_function)(''todo_75p'', ''main'', {''ds_set'':
          ds_set, ''ds_devs'': ds_devs, ''font_dir'': font_dir, ''ds_title'': ds_title, ''ds_todo'': ds_todo, ''language_map'':
          language_map, ''time_format'': time_format, ''weekday_lang'': weekday_lang}) -}}'
  default:
  - action: opendisplay.drawcustom
    target:
      device_id: !input 'displays'
    data:
      background: white
      dither: none
      rotate: !input 'rotate'
      payload: '{%- from ''ep_design.jinja'' import ep_draw -%} {{- (ep_draw | as_function)(''todo_75p'', ''error'', {''ds_set'':
        ds_set, ''ds_devs'': ds_devs, ''font_dir'': font_dir, ''ds_title'': ds_title, ''language_map'': language_map, ''time_format'':
        time_format, ''weekday_lang'': weekday_lang}) -}}'
mode: single
max_exceeded: silent

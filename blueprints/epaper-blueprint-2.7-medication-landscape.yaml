# Generated by lib/generate.py from pages/medication.yaml: edit the page definition, not this file.
blueprint:
  name: E-paper Medication 2.7" landscape
  description: |
    # E-paper Medication 2.7" landscape

    A medication log on one button: press it after taking your medication, and the device shows the time and date of that press, so a glance answers "did I already take this?"

    ## Works with

    2.7" (384 x 168) devices held landscape. Black and white, or with red, yellow or both.

    ## Needs

    - [OpenDisplay integration](https://github.com/OpenDisplay/Home_Assistant_Integration) (v3.0.0-beta.8 or later): installed and configured
    - The design-system templates: copy the four `ep_*.jinja` files from the repository's `custom_templates` folder into `config/custom_templates/`, then run `homeassistant.reload_custom_templates` (or restart Home Assistant). Update them together with the blueprints.
    - The design-system fonts in `/config/www/fonts/` (or another drawcustom font folder): `TRMNL12-Regular.ttf`, `TRMNL12-Bold.ttf`, `TRMNL16-Regular.ttf`, `TRMNL16-Bold.ttf`, `TRMNL21-Regular.ttf` and `TRMNL21-Bold.ttf` from the TRMNL font bundle (SIL OFL 1.1), and `SpaceGrotesk-Bold.ttf` (the static Bold file of Space Grotesk, SIL OFL 1.1).

    ## Trigger advice

    None to set: pick the device and its button's `event.*` entity. The page redraws on a press, and by itself when the warning or severe time since the last press is reached.

    ## Notes

    - The LED flashes as soon as a press is registered, before the ~30 second redraw.
    - Both `button_down` and `button_up` count, because a sleeping device sometimes only delivers the release; one press still gives one redraw.
    - Button devices sold as 2.9": configure the firmware for 168 x 384, or the top 16 px are cut off.

    ## Links

    - [E-paper design system repository](https://github.com/GuySie/epaper-design-system)
    - [E-paper design system](https://github.com/GuySie/epaper-design-system/blob/main/docs/design-system.md)
    - [TRMNL font bundle](https://trmnl.com/font-family)
    - [Space Grotesk (Google Fonts)](https://fonts.google.com/specimen/Space+Grotesk)
    - [OpenDisplay integration](https://github.com/OpenDisplay/Home_Assistant_Integration)
    - Made by [Guy Sie](https://github.com/guysie), with Claude
  source_url: https://github.com/GuySie/epaper-design-system/blob/main/blueprints/epaper-blueprint-2.7-medication-landscape.yaml
  domain: automation
  input:
    display:
      name: Display and schedule
      icon: "mdi:monitor"
      input:
        displays:
          name: E-paper display
          description: The ESL to update when the button is pressed.
          selector:
            device:
              filter:
                integration: opendisplay
        button_entity:
          name: Button
          description: The physical button's event entity, e.g. `event.<your_device>_button_1`. Find it under the device in
            Settings > Devices & services.
          selector:
            entity:
              filter:
                domain: event
        automation_conditions:
          name: Conditions
          description: Optional conditions that must be met to run the automation
          default: []
          selector:
            condition: null
    thresholds:
      name: Thresholds
      icon: "mdi:alert-outline"
      collapsed: true
      input:
        flag_late:
          name: 'Overdue: flag it'
          description: Off, the date never turns into a chip and the device doesn't redraw at the two times below.
          default: true
          selector:
            boolean: {}
        warning_late:
          name: 'Overdue: warning after'
          description: Hours since the last press after which the date turns into a warning chip. The device redraws by itself
            at that moment.
          default: 24
          selector:
            number:
              min: 0
              max: 168
              unit_of_measurement: h
              mode: box
        severe_late:
          name: 'Overdue: severe after'
          description: Hours since the last press after which the date turns into a severe chip. The device redraws by itself
            at that moment.
          default: 36
          selector:
            number:
              min: 0
              max: 168
              unit_of_measurement: h
              mode: box
    appearance:
      name: Appearance
      icon: "mdi:palette-outline"
      collapsed: true
      input:
        header_title:
          name: Header title
          description: Shown in capitals at the top left. Leave blank for "Medication · Last taken" in your language.
          default: ''
          selector:
            text: {}
        time_format:
          name: Time format
          description: 12-hour (AM/PM) or 24-hour clock for the time of the press.
          default: 24h
          selector:
            select:
              options:
              - label: 12-hour (AM/PM)
                value: 12h
              - label: 24-hour
                value: 24h
        weekday_format:
          name: Language
          description: 'Language of the texts on the display: titles, day and month names, messages.'
          default: en
          selector:
            select:
              options:
              - label: English
                value: en
              - label: German
                value: de
              - label: Dutch
                value: nl
              - label: French
                value: fr
              - label: Spanish
                value: es
              - label: Polish
                value: pl
              - label: Croatian
                value: hr
              - label: Swedish
                value: sv
        rotate:
          name: Rotation
          description: 'Display rotation in degrees. This panel is natively portrait (168 x 384): 270 draws this layout upright,
            90 upside down.'
          default: '270'
          selector:
            select:
              options:
              - label: '0'
                value: '0'
              - label: '90'
                value: '90'
              - label: '180'
                value: '180'
              - label: '270'
                value: '270'
    advanced:
      name: Advanced
      icon: "mdi:cog"
      collapsed: true
      input:
        led_color:
          name: LED flash colour
          description: Colour of the confirmation flash shown as soon as a press is registered.
          default:
          - 0
          - 255
          - 0
          selector:
            color_rgb: {}
        led_flash_delay:
          name: LED flash interval
          description: Time between the confirmation flashes.
          default: 500
          selector:
            number:
              min: 100
              max: 1500
              step: 100
              unit_of_measurement: ms
              mode: slider
        font_dir:
          name: Font folder (optional)
          description: Leave empty when the design-system fonts (TRMNL12/16/21 Regular + Bold and SpaceGrotesk-Bold.ttf) are
            in one of drawcustom's font folders (/config/www/fonts, /config/media/fonts or /media/fonts). Otherwise give an
            absolute folder path ending in a slash, e.g. /config/fonts/
          default: ''
          selector:
            text: {}
trigger_variables:
  ds_btn_t: !input 'button_entity'
  ds_warn_h: !input 'warning_late'
  ds_sev_h: !input 'severe_late'
  ds_flag_late: !input 'flag_late'
trigger:
- trigger: template
  id: overdue
  value_template: '{{ ds_flag_late and states(ds_btn_t) not in [''unknown'', ''unavailable''] and as_timestamp(now()) - as_timestamp(states(ds_btn_t),
    0) >= (ds_warn_h | float(0)) * 3600 }}'
- trigger: template
  id: overdue
  value_template: '{{ ds_flag_late and states(ds_btn_t) not in [''unknown'', ''unavailable''] and as_timestamp(now()) - as_timestamp(states(ds_btn_t),
    0) >= (ds_sev_h | float(0)) * 3600 }}'
- trigger: homeassistant
  event: start
  id: redraw
- trigger: state
  entity_id: !input 'button_entity'
  id: press
  not_from:
  - unavailable
  - unknown
  not_to:
  - unavailable
  - unknown
conditions: !input 'automation_conditions'
variables:
  ds_set: 'tgqmqg'
  font_dir: !input 'font_dir'
  ds_devs: !input 'displays'
  weekday_lang: !input 'weekday_format'
  time_format: !input 'time_format'
  header_title: !input 'header_title'
  flag_late: !input 'flag_late'
  warning_late: !input 'warning_late'
  severe_late: !input 'severe_late'
  ds_btn: !input 'button_entity'
  language_map: "{%- from 'ep_i18n.jinja' import EP_TXT -%}{{ EP_TXT['medication'] }}"
  weekday_short_map: "{%- from 'ep_i18n.jinja' import EP_DAYS_SHORT -%}{{ EP_DAYS_SHORT }}"
  months_short_map: "{%- from 'ep_i18n.jinja' import EP_MONTHS_SHORT -%}{{ EP_MONTHS_SHORT }}"
  ds_press_ts: '{{ as_timestamp(states(ds_btn), as_timestamp(now())) }}'
  header_title_display: '{{ header_title if header_title else (language_map[weekday_lang][''default_title''] ~ '' · '' ~ language_map[weekday_lang][''last_taken''])
    }}'
  press_time_label: '{{ (ds_press_ts | float(0)) | timestamp_custom(''%-I:%M %p'') if time_format == ''12h'' else (ds_press_ts
    | float(0)) | timestamp_custom(''%H:%M'') }}'
  ds_date: '{% set t = as_local(as_datetime(ds_press_ts | float(0))) %}{{ weekday_short_map[weekday_lang][t.weekday()] }}
    {{ t.day }} {{ months_short_map[weekday_lang][t.month - 1] }}'
  ds_overdue_k: '{% set h = (as_timestamp(now()) - (ds_press_ts | float(0))) / 3600 %} {% set w, sv = warning_late | float(0),
    severe_late | float(0) %} {% set on = flag_late | default(true) %} {{ ''sev'' if (on and h >= sv) else (''warn'' if (on
    and h >= w) else '''') }}'
action:
- condition: template
  value_template: '{{ trigger.id != ''press'' or trigger.to_state.attributes.get(''event_type'') in [''button_down'', ''button_up'']
    }}'
- if: '{{ trigger.id == ''press'' }}'
  then:
  - action: opendisplay.activate_led
    continue_on_error: true
    data:
      device_id: !input 'displays'
      color1: !input 'led_color'
      flash_count1: 2
      loop_delay1: !input 'led_flash_delay'
      brightness: 16
      repeats: 1
- action: opendisplay.drawcustom
  target:
    device_id: !input 'displays'
  data:
    background: white
    dither: none
    rotate: !input 'rotate'
    payload: '{%- from ''ep_design.jinja'' import ep_draw -%} {{- (ep_draw | as_function)(''medication_27l'', ''main'', {''ds_set'':
      ds_set, ''ds_devs'': ds_devs, ''font_dir'': font_dir, ''ds_date'': ds_date, ''ds_overdue_k'': ds_overdue_k, ''header_title_display'':
      header_title_display, ''language_map'': language_map, ''press_time_label'': press_time_label, ''time_format'': time_format,
      ''weekday_lang'': weekday_lang}) -}}'
mode: single
max_exceeded: silent

# Generated by lib/generate.py from pages/rain.yaml: edit the page definition, not this file.
blueprint:
  name: E-paper Rain forecast (Netherlands) 2.7" landscape
  description: |
    # E-paper Rain forecast (Netherlands) 2.7" landscape

    The next two hours of rain in 5-minute bars, from Buienalarm and Buienradar (the higher of the two for each bar), on a log scale so drizzle stays visible next to a downpour.

    ## Works with

    2.7" (384 x 168) devices held landscape. Black and white, or with red, yellow or both.

    ## Needs

    - [OpenDisplay integration](https://github.com/OpenDisplay/Home_Assistant_Integration) (v3.0.0-beta.8 or later): installed and configured
    - [Neerslag App integration](https://github.com/aex351/home-assistant-neerslag-app): Buienalarm and/or Buienradar, at least one of the two sources enabled
    - The design-system templates: copy the four `ep_*.jinja` files from the repository's `custom_templates` folder into `config/custom_templates/`, then run `homeassistant.reload_custom_templates` (or restart Home Assistant). Update them together with the blueprints.
    - The design-system fonts in `/config/www/fonts/` (or another drawcustom font folder): `TRMNL12-Regular.ttf`, `TRMNL12-Bold.ttf`, `TRMNL16-Regular.ttf`, `TRMNL16-Bold.ttf`, `TRMNL21-Regular.ttf` and `TRMNL21-Bold.ttf` from the TRMNL font bundle (SIL OFL 1.1), and `SpaceGrotesk-Bold.ttf` (the static Bold file of Space Grotesk, SIL OFL 1.1).

    ## Trigger advice

    A time pattern every 5 or 15 minutes; the sources update about every 3 minutes.

    You can add a device's button to the trigger (an "Entity event received" trigger on its `event.*` entity, e.g. `event.<your_device>_button_1`). A press then flashes that device's LED straight away, so you know it registered before the ~30 second redraw. Time-based and other triggers don't flash. If the flash fails, the display is still updated.

    ## Notes

    - Buienradar only covers the Netherlands and Belgium; Buienalarm covers more countries.
    - Button devices sold as 2.9": configure the firmware for 168 x 384, or the top 16 px are cut off.

    ## Links

    - [E-paper design system repository](https://github.com/GuySie/epaper-design-system)
    - [E-paper design system](https://github.com/GuySie/epaper-design-system/blob/main/docs/design-system.md)
    - [TRMNL font bundle](https://trmnl.com/font-family)
    - [Space Grotesk (Google Fonts)](https://fonts.google.com/specimen/Space+Grotesk)
    - [OpenDisplay integration](https://github.com/OpenDisplay/Home_Assistant_Integration)
    - [Neerslag App integration](https://github.com/aex351/home-assistant-neerslag-app)
    - Made by [Guy Sie](https://github.com/guysie), with Claude
  source_url: https://github.com/GuySie/epaper-design-system/blob/main/blueprints/epaper-blueprint-2.7-rain-forecast-netherlands-landscape.yaml
  domain: automation
  input:
    display:

          description: The 2.7" (384 x 168) devices to draw on
          selector:
            device:
              multiple: true
              filter:
                integration: opendisplay
        automation_trigger:
          name: Trigger
          description: When to trigger the automation
          selector:
            trigger: null
        automation_conditions:
          name: Conditions
          description: Optional conditions that must be met to run the automation
          default: []
          selector:
            condition: null
    content:
      name: Content
      icon: "mdi:view-list"
      input:
        buienalarm_entity:
          name: Buienalarm sensor
          description: The Neerslag App Buienalarm forecast sensor
          default: sensor.neerslag_buienalarm_regen_data
          selector:
            entity:
              filter:
                domain: sensor
                integration: neerslag
        buienradar_entity:
          name: Buienradar sensor
          description: The Neerslag App Buienradar forecast sensor
          default: sensor.neerslag_buienradar_regen_data
          selector:
            entity:
              filter:
                domain: sensor
                integration: neerslag
    thresholds:
      name: Thresholds
      icon: "mdi:alert-outline"
      collapsed: true
      input:
        flag_rain_hour:
          name: 'Rain per hour: flag it'
          description: Off, no bar is flagged and the chart shows no threshold lines, whatever the two values below say.
          default: true
          selector:
            boolean: {}

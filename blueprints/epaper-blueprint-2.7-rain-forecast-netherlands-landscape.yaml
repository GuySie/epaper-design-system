          name: 'Rain per hour: warning at or above'
          description: A bar at or above this is a warning. The chart marks the value with the lower dashed line.
          default: 2.5
          selector:
            number:
              min: 0
              step: 0.1
              unit_of_measurement: mm/h
              mode: box
        severe_rain_hour:
          name: 'Rain per hour: severe at or above'
          description: If a timeframe's combined rain intensity is at or above this value, its bar switches to the severe
            colour. The graph uses a log scale up to 50 mm/h (violent rain).
          default: 10
          selector:
            number:
              min: 0
              step: 0.1
              unit_of_measurement: mm/h
              mode: box
    appearance:
      name: Appearance
      icon: "mdi:palette-outline"
      collapsed: true
      input:
        header_title:
          name: Header title
          description: Shown in capitals at the top left. Leave blank for "Rain" in your language.
          default: ''

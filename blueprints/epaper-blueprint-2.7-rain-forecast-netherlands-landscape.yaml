      input:
        stale_after:
          name: Mark data as stale after
          description: When the source hasn't reported data for this many minutes (even an unchanged value counts as a report),
            the timestamp in the title row shows the time of the last update in a black chip with "!". 0 turns this off.
          default: 60
          selector:
            number:
              min: 0
              max: 1440
              unit_of_measurement: min
              mode: box
        led_color:
          name: LED flash colour
          description: Colour of the confirmation flash when the update was triggered by a device button press.
          default:
          - 0
          - 255
          - 0
          selector:
            color_rgb: {}
        led_flash_delay:
          name: LED flash interval
          description: Time between the confirmation flashes.
          default: 500
          selector:
            number:
              min: 100
              max: 1500
              step: 100
              unit_of_measurement: ms
              mode: slider
        font_dir:
          name: Font folder (optional)
          description: Leave empty when the design-system fonts (TRMNL12/16/21 Regular + Bold and SpaceGrotesk-Bold.ttf) are
            in one of drawcustom's font folders (/config/www/fonts, /config/media/fonts or /media/fonts). Otherwise give an
            absolute folder path ending in a slash, e.g. /config/fonts/
          default: ''
          selector:
            text: {}
variables:
  ds_set: 'hznzts'
  font_dir: !input 'font_dir'
  ds_devs: !input 'displays'
  stale_after: !input 'stale_after'
  weekday_lang: !input 'weekday_format'
  time_format: !input 'time_format'
  header_title: !input 'header_title'
  buienalarm_entity: !input 'buienalarm_entity'
  buienradar_entity: !input 'buienradar_entity'
  flag_rain_hour: !input 'flag_rain_hour'
  severe_rain_hour: !input 'severe_rain_hour'
  warning_rain_hour: !input 'warning_rain_hour'
  language_map: "{%- from 'ep_i18n.jinja' import EP_TXT -%}{{ EP_TXT['rain'] }}"
  rain_bars: 24
  rain_top: 50
  has_any_data: |
    {% set raw1 = state_attr(buienalarm_entity, 'data') %} {% set raw2 = state_attr(buienradar_entity, 'data') %} {% set d1 = raw1 is mapping and raw1.get('success', False) and (raw1.get('precip', []) | length > 0) %} {% set d2 = raw2 is string and (raw2 | trim | length > 0) %} {{ d1 or d2 }}
  buckets: |
    {% set ns = namespace(list=[]) %} {% set cap = rain_top %} {% set now_ts = now().timestamp() %} {% set now_5_ts = (now_ts // 300) * 300 %}
    {% set raw1 = state_attr(buienalarm_entity, 'data') %} {% set has_data1 = raw1 is mapping and raw1.get('success', False) and (raw1.get('precip', []) | length > 0) %} {% if has_data1 %}
      {% set start1 = raw1.start | float %}
      {% set start1 = (start1 / 1000) if start1 > 10000000000 else start1 %}
      {% set delta1 = raw1.delta | int(300) %}
      {% set delta1 = 300 if delta1 <= 0 else delta1 %}
      {% set precip1 = raw1.precip %}
    {% endif %}
    {% set raw2 = state_attr(buienradar_entity, 'data') %} {% set has_data2 = raw2 is string and (raw2 | trim | length > 0) %} {% if has_data2 %}
      {% set ns2 = namespace(list=[]) %}
      {% for token in raw2.split(' ') %}
        {% if '|' in token and ':' in token %}
          {% set parts = token.split('|') %}
          {% set code2 = parts[0] | int(0) %}
          {% set hh = parts[1].split(':')[0] | int(0) %}
          {% set mm = parts[1].split(':')[1] | int(0) %}
          {% set cand = now().replace(hour=hh, minute=mm, second=0, microsecond=0) %}
          {% set cand = (cand + timedelta(days=1)) if cand.timestamp() < (now_ts - 3600) else cand %}
          {% set ns2.list = ns2.list + [{'ts': cand.timestamp(), 'code': code2}] %}
        {% endif %}
      {% endfor %}
      {% set parsed2 = ns2.list %}
    {% endif %}
    {% for i in range(rain_bars) %}
      {% set bucket_ts = now_5_ts + (i * 300) %}
      {% set mm1 = namespace(v=0) %}
      {% if has_data1 %}
        {% set idx = ((bucket_ts - start1) / delta1) | round(0, 'common') | int %}
        {% if idx >= 0 and idx < (precip1 | length) and (((start1 + idx * delta1) - bucket_ts) | abs) <= (delta1 / 2) %}
          {% set code1 = precip1[idx] | int(0) %}
          {% set mm1.v = 0 if code1 <= 0 else 10 ** ((code1 - 109) / 32) %}
        {% endif %}
      {% endif %}
      {% set mm2 = namespace(v=0) %}
      {% if has_data2 %}
        {% for entry in parsed2 %}
          {% if ((entry.ts - bucket_ts) | abs) <= 150 %}
            {% set candmm = 0 if entry.code <= 0 else 10 ** ((entry.code - 109) / 32) %}
            {% set mm2.v = candmm if candmm > mm2.v else mm2.v %}
          {% endif %}
        {% endfor %}
      {% endif %}
      {% set mm_h = [mm1.v, mm2.v] | max %}
      {% set scaled = 0 if mm_h <= 0 else [[(((mm_h + 1) | log(10)) / ((cap + 1) | log(10))), 0] | max, 1] | min %}
      {% set bucket_dt = as_datetime(bucket_ts) | as_local %}
      {% set label = bucket_dt.strftime('%H:%M') if time_format == '24h' else ((bucket_dt.strftime('%I') | int | string) + bucket_dt.strftime(':%M')) %}
      {% set ns.list = ns.list + [{
        'index': i,
        'ts': bucket_ts,
        'mm_h': mm_h,
        'scaled': scaled,
        'label': label
      }] %}
    {% endfor %} {{ ns.list }}
  ds_txt: |
    {% set m = {
      "en": {"title": "Rain", "dry": "Dry until", "rain": "Rain", "heavy": "Heavy rain", "peak": "peak", "unit": "mm/h"},
      "de": {"title": "Regen", "dry": "Trocken bis", "rain": "Regen", "heavy": "Starkregen", "peak": "Spitze", "unit": "mm/h"},
      "nl": {"title": "Regen", "dry": "Droog tot", "rain": "Regen", "heavy": "Zware bui", "peak": "piek", "unit": "mm/h"},
      "fr": {"title": "Pluie", "dry": "Sec jusqu'à", "rain": "Pluie", "heavy": "Forte pluie", "peak": "pic", "unit": "mm/h"},
      "es": {"title": "Lluvia", "dry": "Seco hasta", "rain": "Lluvia", "heavy": "Lluvia fuerte", "peak": "pico", "unit": "mm/h"},
      "pl": {"title": "Deszcz", "dry": "Sucho do", "rain": "Deszcz", "heavy": "Ulewa", "peak": "szczyt", "unit": "mm/h"},
      "hr": {"title": "Kiša", "dry": "Suho do", "rain": "Kiša", "heavy": "Jaka kiša", "peak": "vrh", "unit": "mm/h"},
      "sv": {"title": "Regn", "dry": "Torrt till", "rain": "Regn", "heavy": "Skyfall", "peak": "topp", "unit": "mm/h"}
    } %} {{ m[weekday_lang] }}
  ds_title: '{{ header_title if header_title else ds_txt[''title''] }}'
  ds_last_ts: |-
    {% set ns = namespace(t=0) %} {% for e in [buienalarm_entity, buienradar_entity] %}
      {% if e %}{% for s in expand(e) %}{% set ns.t = [ns.t, as_timestamp(s.last_reported | default(s.last_updated), 0)] | max %}{% endfor %}{% endif %}
    {% endfor %} {{ ns.t }}
  ds_stale: '{{ (stale_after | int(0)) > 0 and (ds_last_ts | float(0)) > 0 and (as_timestamp(now()) - (ds_last_ts | float(0)))
    > (stale_after | int(0)) * 60 }}'
trigger: !input 'automation_trigger'
conditions: !input 'automation_conditions'
action:
- alias: 'Button feedback: flash the pressed device''s LED'
  if:
  - condition: template
    value_template: |-
      {{ trigger is defined and trigger.entity_id is defined and trigger.entity_id is string
         and trigger.entity_id.startswith('event.') and device_id(trigger.entity_id) is not none }}
  then:
  - action: opendisplay.activate_led
    continue_on_error: true
    data:
      device_id: '{{ device_id(trigger.entity_id) }}'
      color1: !input 'led_color'
      flash_count1: 2
      loop_delay1: !input 'led_flash_delay'
      brightness: 16
      repeats: 1
- choose:
  - conditions:
    - '{{ has_any_data }}'
    sequence:
    - action: opendisplay.drawcustom
      target:
        device_id: !input 'displays'
      data:
        background: white
        dither: none
        rotate: !input 'rotate'
        payload: '{%- from ''ep_design.jinja'' import ep_draw -%} {{- (ep_draw | as_function)(''rain_27l'', ''main'', {''ds_set'':
          ds_set, ''ds_devs'': ds_devs, ''font_dir'': font_dir, ''buckets'': buckets, ''ds_last_ts'': ds_last_ts, ''ds_stale'':
          ds_stale, ''ds_title'': ds_title, ''ds_txt'': ds_txt, ''flag_rain_hour'': flag_rain_hour, ''severe_rain_hour'':
          severe_rain_hour, ''time_format'': time_format, ''warning_rain_hour'': warning_rain_hour, ''weekday_lang'': weekday_lang})
          -}}'
  default:
  - action: opendisplay.drawcustom
    target:
      device_id: !input 'displays'
    data:
      background: white
      dither: none
      rotate: !input 'rotate'
      payload: '{%- from ''ep_design.jinja'' import ep_draw -%} {{- (ep_draw | as_function)(''rain_27l'', ''error'', {''ds_set'':
        ds_set, ''ds_devs'': ds_devs, ''font_dir'': font_dir, ''ds_title'': ds_title, ''language_map'': language_map, ''time_format'':
        time_format, ''weekday_lang'': weekday_lang}) -}}'
mode: single
max_exceeded: silent

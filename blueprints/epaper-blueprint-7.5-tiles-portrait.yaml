  entity_12_label: !input 'entity_12_label'
  entity_12_icon: !input 'entity_12_icon'
  language_map: "{%- from 'ep_i18n.jinja' import EP_TXT -%}{{ EP_TXT['tiles'] }}"
  header_title_display: '{{ header_title if header_title else language_map[weekday_lang][''default_title''] }}'
  ds_unavail_msg: '{{ language_map[weekday_lang][''most_unavailable''] }}'
  ds_tiles: |
    {% set ns = namespace(list=[]) %} {% set slots = [
      [entity_1 | default(''), entity_1_label | default(''), entity_1_icon | default('')],
      [entity_2 | default(''), entity_2_label | default(''), entity_2_icon | default('')],
      [entity_3 | default(''), entity_3_label | default(''), entity_3_icon | default('')],
      [entity_4 | default(''), entity_4_label | default(''), entity_4_icon | default('')],
      [entity_5 | default(''), entity_5_label | default(''), entity_5_icon | default('')],
      [entity_6 | default(''), entity_6_label | default(''), entity_6_icon | default('')],
      [entity_7 | default(''), entity_7_label | default(''), entity_7_icon | default('')],
      [entity_8 | default(''), entity_8_label | default(''), entity_8_icon | default('')],
      [entity_9 | default(''), entity_9_label | default(''), entity_9_icon | default('')],
      [entity_10 | default(''), entity_10_label | default(''), entity_10_icon | default('')],
      [entity_11 | default(''), entity_11_label | default(''), entity_11_icon | default('')],
      [entity_12 | default(''), entity_12_label | default(''), entity_12_icon | default('')]
    ] %} {% for e, lab, ic in slots %}
      {% if e and e != '' %}
        {% set raw = states(e) %}
        {% set ok = raw not in ['unknown', 'unavailable', 'none', ''] %}
        {% set word = state_translated(e) if (ok and raw | float(none) is none) else raw %}
        {% set ns.list = ns.list + [{'label': lab if lab else (entity_name(e) or device_name(e) or e), 'raw': word, 'unit': (state_attr(e, 'unit_of_measurement') or '') if ok else '', 'icon': ic if ic else (state_attr(e, 'icon') or ''), 'ok': ok}] %}
      {% endif %}
    {% endfor %} {{ ns.list }}
  ds_last_ts: |-
    {% set ns = namespace(t=0) %} {% for e in [entity_1, entity_2, entity_3, entity_4, entity_5, entity_6, entity_7, entity_8, entity_9, entity_10, entity_11, entity_12] %}
      {% if e %}{% for s in expand(e) %}{% set ns.t = [ns.t, as_timestamp(s.last_reported | default(s.last_updated), 0)] | max %}{% endfor %}{% endif %}
    {% endfor %} {{ ns.t }}
  ds_stale: '{{ (stale_after | int(0)) > 0 and (ds_last_ts | float(0)) > 0 and (as_timestamp(now()) - (ds_last_ts | float(0)))
    > (stale_after | int(0)) * 60 }}'
trigger: !input 'automation_trigger'
conditions: !input 'automation_conditions'
action:
- alias: 'Button feedback: flash the pressed device''s LED'
  if:
  - condition: template
    value_template: |-
      {{ trigger is defined and trigger.entity_id is defined and trigger.entity_id is string
         and trigger.entity_id.startswith('event.') and device_id(trigger.entity_id) is not none }}
  then:
  - action: opendisplay.activate_led
    continue_on_error: true
    data:
      device_id: '{{ device_id(trigger.entity_id) }}'
      color1: !input 'led_color'
      flash_count1: 2
      loop_delay1: !input 'led_flash_delay'
      brightness: 16
      repeats: 1
- action: opendisplay.drawcustom
  target:
    device_id: !input 'displays'
  data:
    background: white
    dither: none
    rotate: !input 'rotate'
    payload: '{%- from ''ep_design.jinja'' import ep_draw -%} {{- (ep_draw | as_function)(''tiles_75p'', ''main'', {''ds_set'':
      ds_set, ''ds_devs'': ds_devs, ''font_dir'': font_dir, ''ds_last_ts'': ds_last_ts, ''ds_stale'': ds_stale, ''ds_tiles'':
      ds_tiles, ''ds_unavail_msg'': ds_unavail_msg, ''header_title_display'': header_title_display, ''time_format'': time_format,
      ''weekday_lang'': weekday_lang}) -}}'
mode: single
max_exceeded: silent

blueprint:
  name: E-paper Appliance run 4.1"
  description: |
    # E-paper Appliance run 4.1"

    When a run of an appliance ends (a washing machine, a dryer, a dishwasher) and how far it is; with a door sensor, whether it still waits to be emptied.

    ## Works with

    4.1" (400 x 300) devices. Black and white, or with red, yellow or both.

    ## Needs

    - [OpenDisplay integration](https://github.com/OpenDisplay/Home_Assistant_Integration) (v3.0.0-beta.8 or later): installed and configured
    - The design-system templates: copy the four `ep_*.jinja` files from the repository's `custom_templates` folder into `config/custom_templates/`, then run `homeassistant.reload_custom_templates` (or restart Home Assistant). Update them together with the blueprints.
    - The design-system fonts in `/config/www/fonts/` (or another drawcustom font folder): `TRMNL12-Regular.ttf`, `TRMNL12-Bold.ttf`, `TRMNL16-Regular.ttf`, `TRMNL16-Bold.ttf`, `TRMNL21-Regular.ttf` and `TRMNL21-Bold.ttf` from the TRMNL font bundle (SIL OFL 1.1), and `SpaceGrotesk-Bold.ttf` (the static Bold file of Space Grotesk, SIL OFL 1.1).

    ## Trigger advice

    None to set: the page redraws by itself when the status changes, the door opens or closes, the end time moves 5 minutes or more, the run passes another tenth, and at the two not-emptied times.

    ## Links

    - [E-paper design system repository](https://github.com/GuySie/epaper-design-system)
    - [E-paper design system](https://github.com/GuySie/epaper-design-system/blob/main/docs/design-system.md)
    - [TRMNL font bundle](https://trmnl.com/font-family)
    - [Space Grotesk (Google Fonts)](https://fonts.google.com/specimen/Space+Grotesk)
    - [OpenDisplay integration](https://github.com/OpenDisplay/Home_Assistant_Integration)
    - Made by [Guy Sie](https://github.com/guysie), with Claude
  source_url: https://github.com/GuySie/epaper-design-system/blob/main/blueprints/epaper-blueprint-4.1-appliance-run.yaml
  domain: automation
  input:
    display:
      name: Display and schedule
      icon: "mdi:monitor"
      input:
        displays:
          name: E-paper display(s)
          description: The 4.1" (400 x 300) devices to draw on
          selector:
            device:
              multiple: true
              filter:
                integration: opendisplay
        automation_conditions:
          name: Conditions
          description: Optional conditions that must be met to run the automation
          default: []
          selector:
            condition: null
    content:
      name: Content
      icon: "mdi:view-list"
      input:
        status_entity:
          name: Status entity
          description: The appliance's status (its operation state or machine state). Which of its states mean running and
            done is set below.
          selector:
            entity: {}
        end_entity:
          name: End time or time left
          description: A sensor with the time the run ends (a timestamp), or the time left (a duration in seconds, minutes,
            hours or days). The device redraws when one report moves the end 5 minutes or more.
          selector:
            entity:
              filter:
                domain: sensor
        progress_entity:
          name: Progress (optional)
          description: A sensor with the share of the run done, in percent, written under the bar. Leave blank and the bar
            follows the time since the status last changed; an appliance whose status steps through several running states
            (wash, rinse, spin) needs this sensor.
          default: ''
          selector:
            entity:
              filter:
                domain: sensor
        programme_entity:
          name: Programme (optional)
          description: Its state is written under the bar, cut short when it is long. Leave blank for none.
          default: ''
          selector:
            entity: {}
        door_entity:
          name: Door (optional)
          description: The door's sensor. A run that is done with the door closed is flagged as not emptied after the times
            under Thresholds; while the door is open, the page shows that nothing is running. An appliance that stays done
            after it is emptied is flagged again once its door is shut. Leave blank for none.
          default: ''
          selector:
            entity:
              filter:
                domain: binary_sensor
        icon:
          name: Icon
          description: Shown after the end time, when there is one. A wide time leaves less room for it.
          default: mdi:washing-machine
          selector:
            icon: {}
        running_states:
          name: States that mean running
          description: The status's states while a run is on, written as shown or as Home Assistant stores them (case doesn't
            matter). A paused run counts as running when its state is here.
          default:
          - run
          - running
          - in_use
          - wash
          - washing
          - rinse
          - rinsing
          - spin
          - spinning
          - dry
          - drying
          - pause
          - paused
          selector:
            text:
              multiple: true
        done_states:
          name: States that mean done
          description: The status's states when a run has ended, written as shown or as Home Assistant stores them (case doesn't
            matter). Any other state shows that nothing is running; an unavailable status shows an error.
          default:
          - finished
          - end
          - complete
          - completed
          - done
          selector:
            text:
              multiple: true
    thresholds:
      name: Thresholds
      icon: "mdi:alert-outline"
      collapsed: true
      input:
        flag_unemptied:
          name: 'Not emptied: flag it'
          description: Off, a run that is done is never flagged, and the device doesn't redraw at the two times below.
          default: true
          selector:
            boolean: {}
        warning_unemptied:
          name: 'Not emptied: warning after'
          description: Minutes after the status turned done, with the door closed, at which the line under the bar turns into
            a warning chip and the bar takes the warning level (yellow or grey where the panel has it). The device redraws
            by itself at that moment.
          default: 15
          selector:
            number:
              min: 0
              max: 1440
              unit_of_measurement: min
              mode: box
        severe_unemptied:
          name: 'Not emptied: severe after'
          description: Minutes after the status turned done, with the door closed, at which the chip and the bar turn severe.
            The device redraws by itself at that moment.
          default: 120
          selector:
            number:
              min: 0
              max: 1440
              unit_of_measurement: min
              mode: box
    appearance:
      name: Appearance
      icon: "mdi:palette-outline"
      collapsed: true
      input:
        header_title:
          name: Header title
          description: Shown in capitals at the top left. Leave blank for the appliance's device name.
          default: ''
          selector:
            text: {}
        time_format:
          name: Time format
          description: 12-hour (AM/PM) or 24-hour clock for the update time.
          default: 24h
          selector:
            select:
              options:
              - label: 12-hour (AM/PM)
                value: 12h
              - label: 24-hour
                value: 24h
        weekday_format:
          name: Language
          description: 'Language of the texts on the display: titles, day and month names, messages.'
          default: en
          selector:
            select:
              options:
              - label: English
                value: en
              - label: German
                value: de
              - label: Dutch
                value: nl
              - label: French
                value: fr
              - label: Spanish
                value: es
              - label: Polish
                value: pl
              - label: Croatian
                value: hr
              - label: Swedish
                value: sv
        rotate:
          name: Rotation
          description: 'Display rotation in degrees. This panel is natively landscape (400 x 300): 270 draws this layout upright,
            90 upside down.'
          default: '270'
          selector:
            select:
              options:
              - label: '0'
                value: '0'
              - label: '90'
                value: '90'
              - label: '180'
                value: '180'
              - label: '270'
                value: '270'
    advanced:
      name: Advanced
      icon: "mdi:cog"
      collapsed: true
      input:
        font_dir:
          name: Font folder (optional)
          description: Leave empty when the design-system fonts (TRMNL12/16/21 Regular + Bold and SpaceGrotesk-Bold.ttf) are
            in one of drawcustom's font folders (/config/www/fonts, /config/media/fonts or /media/fonts). Otherwise give an
            absolute folder path ending in a slash, e.g. /config/fonts/
          default: ''
          selector:
            text: {}

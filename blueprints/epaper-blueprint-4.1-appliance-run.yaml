- trigger: homeassistant
  event: start
  id: redraw
conditions: !input 'automation_conditions'
variables:
  ds_set: 'hznzts'
  font_dir: !input 'font_dir'
  ds_devs: !input 'displays'
  weekday_lang: !input 'weekday_format'
  time_format: !input 'time_format'
  header_title: !input 'header_title'
  status_entity: !input 'status_entity'
  end_entity: !input 'end_entity'
  progress_entity: !input 'progress_entity'
  programme_entity: !input 'programme_entity'
  door_entity: !input 'door_entity'
  ds_icon: !input 'icon'
  running_states: !input 'running_states'
  done_states: !input 'done_states'
  flag_unemptied: !input 'flag_unemptied'
  warning_unemptied: !input 'warning_unemptied'
  severe_unemptied: !input 'severe_unemptied'
  language_map: "{%- from 'ep_i18n.jinja' import EP_TXT -%}{{ EP_TXT['appliance'] }}"
  text_strip_pattern: '[^ -ɏ‐-‧‰-※€™]'
  ds_title: '{{ header_title if header_title else ((device_name(status_entity) or entity_name(status_entity) or status_entity)
    | string | regex_replace(text_strip_pattern, '''') | regex_replace('' {2,}'', '' '') | trim) }}'
  ds_run: |
    {# follows *Appliance run*; *Text rules*, *Sanitise all user text* #}
    {% set raw = states(status_entity) %} {% set ok = raw not in ['unknown', 'unavailable', 'none', ''] %}
    {% set keys = [raw | lower, (state_translated(status_entity) | string | lower)] %}
    {% set rl = running_states | default([]) | map('lower') | list %} {% set dl = done_states | default([]) | map('lower') | list %}
    {% set st = 'err' if not ok else ('run' if (keys[0] in rl or keys[1] in rl) else ('done' if (keys[0] in dl or keys[1] in dl) else 'idle')) %}
    {% set since = as_timestamp((expand(status_entity) | first).last_changed) if ok else 0 %}
    {% set er = states(end_entity) %} {% set en = er | float(none) %}
    {% set ets = none %}
    {% if er not in ['unknown', 'unavailable', 'none', ''] %}
      {% if en is not none %}{% set u = state_attr(end_entity, 'unit_of_measurement') %}{% set mult = 1 if u == 's' else (3600 if u == 'h' else (86400 if u == 'd' else 60)) %}{% set eo = expand(end_entity) | first %}{% set ets = as_timestamp(eo.last_reported | default(eo.last_updated, true)) + en * mult %}
      {% else %}{% set ets = as_timestamp(er, none) %}{% endif %}
    {% endif %}
    {% set pr = states(progress_entity) | float(none) if progress_entity else none %} {% set pr = ([0, [100, pr] | min] | max) if pr is not none else none %}
    {% set share = 100 if st == 'done' else (pr if pr is not none else (([0, [100, (as_timestamp(now()) - since) / (ets - since) * 100] | min] | max) if (ets is not none and ets > since) else 0)) %}
    {% set pg = (state_translated(programme_entity) | string | regex_replace(text_strip_pattern, '') | regex_replace(' {2,}', ' ') | trim) if (programme_entity and states(programme_entity) not in ['unknown', 'unavailable', 'none', '']) else '' %}
    {% set door = expand(door_entity) | first if door_entity else none %}
    {# a door that is unavailable or unknown counts as none; not emptied is done with the door closed now #}
    {% set door = door if (door is not none and door.state in ['on', 'off']) else none %}
    {% set closed = door is not none and door.state == 'off' %}
    {% set mins = (as_timestamp(now()) - since) / 60 %}
    {% set st = 'idle' if (st == 'done' and door is not none and not closed) else st %}
    {% set lvl = ('sev' if mins >= severe_unemptied | float(120) else ('warn' if mins >= warning_unemptied | float(15) else '')) if (st == 'done' and closed and flag_unemptied) else '' %}
    {{ {'st': st, 'end': (since if st == 'done' else ets), 'share': share | round(1), 'pct': (pr | round | int) if pr is not none else none, 'prog': pg, 'level': lvl, 'closed': closed} }}
action:
- condition: template
  value_template: '{% if trigger.id == ''status'' %}{{ trigger.from_state is none or trigger.to_state is none or trigger.from_state.state
    != trigger.to_state.state }} {% elif trigger.id == ''end'' %}{% set ss = [trigger.from_state, trigger.to_state] %}{% set
    e = namespace(l=[]) %}{% for s in ss %}{% set n = (s.state | float(none)) if s else none %}{% set u = s.attributes.get(''unit_of_measurement'')
    if s else '''' %}{% set m = 1 if u == ''s'' else (3600 if u == ''h'' else (86400 if u == ''d'' else 60)) %}{% set e.l
    = e.l + [((as_timestamp(s.last_reported | default(s.last_updated, true)) + n * m) if n is not none else as_timestamp(s.state,
    none)) if s else none] %}{% endfor %}{{ none in e.l or ((e.l[1] - e.l[0]) | abs) >= 300 }} {% else %}true{% endif %}'
- action: opendisplay.drawcustom
  target:
    device_id: !input 'displays'
  data:
    background: white
    dither: none
    rotate: !input 'rotate'
    payload: '{%- from ''ep_design.jinja'' import ep_draw -%} {{- (ep_draw | as_function)(''appliance_41'', ''main'', {''ds_set'':
      ds_set, ''ds_devs'': ds_devs, ''font_dir'': font_dir, ''ds_icon'': ds_icon, ''ds_run'': ds_run, ''ds_title'': ds_title,
      ''language_map'': language_map, ''time_format'': time_format, ''weekday_lang'': weekday_lang}) -}}'
mode: queued
max_exceeded: silent
max: 3

variables:
  ds_set: 'iiyqeo'
  font_dir: !input 'font_dir'
  ds_devs: !input 'displays'
  stale_after: !input 'stale_after'
  weekday_lang: !input 'weekday_format'
  time_format: !input 'time_format'
  header_title: !input 'header_title'
  flag_usage: !input 'flag_usage'
  warning_usage: !input 'warning_usage'
  severe_usage: !input 'severe_usage'
  bar_1: !input 'bar_1'
  bar_1_label: !input 'bar_1_label'
  bar_1_reset: !input 'bar_1_reset'
  bar_1_period_hours: !input 'bar_1_period_hours'
  bar_2: !input 'bar_2'
  bar_2_label: !input 'bar_2_label'
  bar_2_reset: !input 'bar_2_reset'
  bar_2_period_hours: !input 'bar_2_period_hours'
  bar_3: !input 'bar_3'
  bar_3_label: !input 'bar_3_label'
  bar_3_reset: !input 'bar_3_reset'
  bar_3_period_hours: !input 'bar_3_period_hours'
  bar_4: !input 'bar_4'
  bar_4_label: !input 'bar_4_label'
  bar_4_reset: !input 'bar_4_reset'
  bar_4_period_hours: !input 'bar_4_period_hours'
  language_map: "{%- from 'ep_i18n.jinja' import EP_TXT -%}{{ EP_TXT['claude'] }}"
  header_title_display: '{{ header_title if header_title else language_map[weekday_lang][''default_title''] }}'
  bars: |
    {% set ns = namespace(list=[]) %} {% set lang = language_map[weekday_lang] %} {% set slots = [
      {'entity': bar_1, 'label': bar_1_label, 'reset_entity': bar_1_reset, 'period_hours': bar_1_period_hours},
      {'entity': bar_2, 'label': bar_2_label, 'reset_entity': bar_2_reset, 'period_hours': bar_2_period_hours},
      {'entity': bar_3, 'label': bar_3_label, 'reset_entity': bar_3_reset, 'period_hours': bar_3_period_hours},
      {'entity': bar_4, 'label': bar_4_label, 'reset_entity': bar_4_reset, 'period_hours': bar_4_period_hours}
    ] %} {% for slot in slots %}
      {% if slot.entity and slot.entity != '' %}
        {% set raw_state = states(slot.entity) %}
        {% set has_value = raw_state not in ['unknown', 'unavailable', 'none', ''] %}
        {% set pct_raw = (raw_state | float(0)) if has_value else 0 %}
        {% set pct_raw = ([pct_raw, 0] | max) %}
        {% set pct_raw = ([pct_raw, 100] | min) %}
        {% set pct = pct_raw | round | int %}
        {% set fname = entity_name(slot.entity) or device_name(slot.entity) or slot.entity %}
        {% set label_text = slot.label if slot.label and slot.label != '' else (fname[:-6] if fname.endswith(' Usage') else fname) %}
        {% set reset_raw = state_attr(slot.entity, 'resets_at') %}
        {% if not reset_raw and slot.reset_entity and slot.reset_entity != '' %}
          {% set reset_raw = states(slot.reset_entity) %}
        {% endif %}
        {% set marker_pct = none %}
        {% if reset_raw and reset_raw not in ['unknown', 'unavailable', ''] %}
          {% set reset_dt = as_datetime(reset_raw) | as_local %}
          {% set reset_ts = as_timestamp(reset_dt) %}
          {% if slot.period_hours and slot.period_hours > 0 %}
            {% set seconds_remaining = ([(reset_dt - now()).total_seconds(), 0] | max) %}
            {% set period_seconds = slot.period_hours * 3600 %}
            {% set remaining_frac = ([seconds_remaining / period_seconds, 1] | min) %}
            {% set marker_pct = ((1 - remaining_frac) * 100) | round | int %}
          {% endif %}
        {% else %}
          {% set reset_ts = 0 %}
        {% endif %}
        {% set ns.list = ns.list + [{
          'label': label_text,
          'percent': pct,
          'percent_text': ((pct | string) + '%') if has_value else '--',
          'is_warning': (flag_usage | default(true)) and has_value and pct >= warning_usage,
          'is_severe': (flag_usage | default(true)) and has_value and pct >= severe_usage,
          'reset_ts': reset_ts,
          'marker_pct': marker_pct
        }] %}
      {% endif %}
    {% endfor %} {{ ns.list }}
  ds_last_ts: |-
    {% set ns = namespace(t=0) %} {% for e in [bar_1, bar_2, bar_3, bar_4] %}
      {% if e %}{% for s in expand(e) %}{% set ns.t = [ns.t, as_timestamp(s.last_reported | default(s.last_updated), 0)] | max %}{% endfor %}{% endif %}
    {% endfor %} {{ ns.t }}
  ds_stale: '{{ (stale_after | int(0)) > 0 and (ds_last_ts | float(0)) > 0 and (as_timestamp(now()) - (ds_last_ts | float(0)))
    > (stale_after | int(0)) * 60 }}'
trigger: !input 'automation_trigger'
conditions: !input 'automation_conditions'
action:
- alias: 'Button feedback: flash the pressed device''s LED'
  if:
  - condition: template
    value_template: |-
      {{ trigger is defined and trigger.entity_id is defined and trigger.entity_id is string
         and trigger.entity_id.startswith('event.') and device_id(trigger.entity_id) is not none }}
  then:
  - action: opendisplay.activate_led
    continue_on_error: true
    data:
      device_id: '{{ device_id(trigger.entity_id) }}'
      color1: !input 'led_color'
      flash_count1: 2
      loop_delay1: !input 'led_flash_delay'
      brightness: 16
      repeats: 1
- choose:
  - conditions:
    - '{{ bars | length > 0 }}'
    sequence:
    - action: opendisplay.drawcustom
      target:
        device_id: !input 'displays'
      data:
        background: white
        dither: none
        rotate: !input 'rotate'
        payload: '{%- from ''ep_design.jinja'' import ep_draw -%} {{- (ep_draw | as_function)(''claude_35'', ''main'', {''ds_set'':
          ds_set, ''ds_devs'': ds_devs, ''font_dir'': font_dir, ''bars'': bars, ''ds_last_ts'': ds_last_ts, ''ds_stale'':
          ds_stale, ''flag_usage'': flag_usage, ''header_title_display'': header_title_display, ''language_map'': language_map,
          ''time_format'': time_format, ''weekday_lang'': weekday_lang}) -}}'
  default:
  - action: opendisplay.drawcustom
    target:
      device_id: !input 'displays'
    data:
      background: white
      dither: none
      rotate: !input 'rotate'
      payload: '{%- from ''ep_design.jinja'' import ep_draw -%} {{- (ep_draw | as_function)(''claude_35'', ''error'', {''ds_set'':
        ds_set, ''ds_devs'': ds_devs, ''font_dir'': font_dir, ''header_title_display'': header_title_display, ''language_map'':
        language_map, ''time_format'': time_format, ''weekday_lang'': weekday_lang}) -}}'
mode: single
max_exceeded: silent

variables:
  ds_set: 'hznzts'
  font_dir: !input 'font_dir'
  ds_devs: !input 'displays'
  weekday_lang: !input 'weekday_format'
  time_format: !input 'time_format'
  header_title: !input 'header_title'
  entity: !input 'entity'
  secondary_entity: !input 'secondary_entity'
  ds_icon: !input 'icon'
  warning_states: !input 'warning_states'
  severe_states: !input 'severe_states'
  text_strip_pattern: '[^ -ɏ‐-‧‰-※€™]'
  ds_title: '{{ header_title if header_title else ((area_name(entity) or entity_name(entity) or device_name(entity) or entity)
    | string | regex_replace(text_strip_pattern, '''') | regex_replace('' {2,}'', '' '') | trim) }}'
  ds_room: |
    {% set raw = states(entity) %} {% set ok = raw not in ['unknown', 'unavailable', 'none', ''] %}
    {# follows *Text rules*, *Sanitise all user text*; *Room sign*, *Flagged* #}
    {% set num = raw | float(none) is not none %}
    {% set word = ((raw if num else state_translated(entity)) | string | regex_replace(text_strip_pattern, '') | regex_replace(' {2,}', ' ') | trim) if ok else '' %}
    {% set keys = [raw | lower, word | lower] %}
    {% set sev = severe_states | default([]) | map('lower') | list %} {% set warn = warning_states | default([]) | map('lower') | list %}
    {% set lvl = ('sev' if (keys[0] in sev or keys[1] in sev) else ('warn' if (keys[0] in warn or keys[1] in warn) else '')) if ok else '' %}
    {% set se = secondary_entity | default('') %} {% set s2 = states(se) if se else '' %}
    {% set ok2 = s2 not in ['unknown', 'unavailable', 'none', ''] %} {% set num2 = ok2 and s2 | float(none) is not none %}
    {% set name = ((entity_name(entity) or device_name(entity) or entity) | string | regex_replace(text_strip_pattern, '') | regex_replace(' {2,}', ' ') | trim) %}
    {{ {'word': word, 'name': name, 'level': lvl, 'second': (s2 if num2 else (state_translated(se) | string | regex_replace(text_strip_pattern, '') | regex_replace(' {2,}', ' ') | trim)) if ok2 else '', 'second_num': num2,
        'second_unit': ((state_attr(se, 'unit_of_measurement') or '') | string | regex_replace(text_strip_pattern, '') | trim) if (se and ok2) else ''} }}
trigger: !input 'automation_trigger'
conditions: !input 'automation_conditions'
action:
- alias: 'Button feedback: flash the pressed device''s LED'
  if:
  - condition: template
    value_template: |-
      {{ trigger is defined and trigger.entity_id is defined and trigger.entity_id is string
         and trigger.entity_id.startswith('event.') and device_id(trigger.entity_id) is not none }}
  then:
  - action: opendisplay.activate_led
    continue_on_error: true
    data:
      device_id: '{{ device_id(trigger.entity_id) }}'
      color1: !input 'led_color'
      flash_count1: 2
      loop_delay1: !input 'led_flash_delay'
      brightness: 16
      repeats: 1
- action: opendisplay.drawcustom
  target:
    device_id: !input 'displays'
  data:
    background: white
    dither: none
    rotate: !input 'rotate'
    payload: '{%- from ''ep_design.jinja'' import ep_draw -%} {{- (ep_draw | as_function)(''room_sign_27l'', ''main'', {''ds_set'':
      ds_set, ''ds_devs'': ds_devs, ''font_dir'': font_dir, ''ds_icon'': ds_icon, ''ds_room'': ds_room, ''ds_title'': ds_title,
      ''time_format'': time_format, ''weekday_lang'': weekday_lang}) -}}'
mode: single
max_exceeded: silent

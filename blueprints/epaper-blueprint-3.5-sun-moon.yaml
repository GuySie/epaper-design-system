# Generated by lib/generate.py from pages/sun-moon.yaml: edit the page definition, not this file.
blueprint:
  name: E-paper Sun & moon 3.5"
  description: |
    # E-paper Sun & moon 3.5"

    Today's dawn, sunrise, noon, sunset and dusk, with the sun (and optionally the moon) on a horizon track.

    ## Works with

    3.5" (384 x 184) devices. Black and white, or with red, yellow or both.

    ## Needs

    - [OpenDisplay integration](https://github.com/OpenDisplay/Home_Assistant_Integration) (v3.0.0-beta.8 or later): installed and configured
    - [Sun integration](https://www.home-assistant.io/integrations/sun): for day and night weather icons
    - The design-system templates: copy the four `ep_*.jinja` files from the repository's `custom_templates` folder into `config/custom_templates/`, then run `homeassistant.reload_custom_templates` (or restart Home Assistant). Update them together with the blueprints.
    - The design-system fonts in `/config/www/fonts/` (or another drawcustom font folder): `TRMNL12-Regular.ttf`, `TRMNL12-Bold.ttf`, `TRMNL16-Regular.ttf`, `TRMNL16-Bold.ttf`, `TRMNL21-Regular.ttf` and `TRMNL21-Bold.ttf` from the TRMNL font bundle (SIL OFL 1.1), and `SpaceGrotesk-Bold.ttf` (the static Bold file of Space Grotesk, SIL OFL 1.1).
    - Optional: [Moon integration](https://www.home-assistant.io/integrations/moon): for the moon phase
    - Optional: [Lunar Phase integration](https://github.com/ngocjohn/lunar-phase): from HACS, for the moon's position on the horizon (the core Moon integration only gives the phase)

    ## Trigger advice

    A time pattern every 15 or 30 minutes.

    You can add a device's button to the trigger (an "Entity event received" trigger on its `event.*` entity, e.g. `event.<your_device>_button_1`). A press then flashes that device's LED straight away, so you know it registered before the ~30 second redraw. Time-based and other triggers don't flash. If the flash fails, the display is still updated.

    ## Links

    - [E-paper design system repository](https://github.com/GuySie/epaper-design-system)
    - [E-paper design system](https://github.com/GuySie/epaper-design-system/blob/main/docs/design-system.md)
    - [TRMNL font bundle](https://trmnl.com/font-family)
    - [Space Grotesk (Google Fonts)](https://fonts.google.com/specimen/Space+Grotesk)
    - [OpenDisplay integration](https://github.com/OpenDisplay/Home_Assistant_Integration)
    - [Sun integration](https://www.home-assistant.io/integrations/sun)
    - [Moon integration](https://www.home-assistant.io/integrations/moon)
    - [Lunar Phase integration](https://github.com/ngocjohn/lunar-phase)
    - Inspired by: [sun-stand automation by sgmobiledev](https://github.com/sgmobiledev/OpenEpaperLinkHATagSources/blob/main/2.66-SoluM-epaper-devices/2.66-sun-stand.yaml)
    - Made by [Guy Sie](https://github.com/guysie), with Claude
  source_url: https://github.com/GuySie/epaper-design-system/blob/main/blueprints/epaper-blueprint-3.5-sun-moon.yaml
  domain: automation
  input:
    display:
      name: Display and schedule
      icon: "mdi:monitor"
      input:
        displays:
          name: E-paper display(s)
          description: The 3.5" (384 x 184) devices to draw on
          selector:
            device:
              multiple: true
              filter:
                integration: opendisplay
        automation_trigger:
          name: Trigger
          description: When to trigger the automation
          selector:
            trigger: null
        automation_conditions:
          name: Conditions
          description: Optional conditions that must be met to run the automation
          default: []
          selector:
            condition: null
    content:
      name: Content
      icon: "mdi:view-list"
      input:
        moon_azimuth_sensor:
          name: Moon azimuth sensor
          description: Optional sensor reporting the moon's azimuth in degrees, e.g. the "Moon Azimuth" sensor from the Lunar
            Phase integration. Home Assistant's core Moon integration doesn't provide this. Leave blank to omit the moon from
            the horizon strip.
          default: ''
          selector:
            entity:
              domain: sensor
        moon_altitude_sensor:
          name: Moon altitude sensor
          description: Optional sensor reporting the moon's altitude (elevation) in degrees, e.g. the "Moon Altitude" sensor
            from the Lunar Phase integration. Leave blank to omit the moon from the horizon strip.
          default: ''
          selector:
            entity:
              domain: sensor
        moon_phase_sensor:
          name: Moon phase sensor
          description: Optional moon phase sensor used to pick the moon icon. Leave blank to detect the Moon integration's
            sensor automatically (its entity ID is translated, so it isn't always `sensor.moon_phase`). Set this to use a
            different sensor, such as the Lunar Phase integration's "Moon Phase" sensor (its entity_id differs per configured
            location).
          default: ''
          selector:
            entity:
              domain: sensor
        hemisphere:
          name: Hemisphere
          description: Your hemisphere. At solar noon the sun sits due south (azimuth 180°) in the Northern Hemisphere but
            due north (azimuth 0°/360°) in the Southern Hemisphere. This is used to correctly center the sun/moon position
            on the horizon strip so it sweeps left-to-right without jumping.
          default: northern
          selector:
            select:
              options:
              - label: Northern
                value: northern
              - label: Southern
                value: southern
    appearance:
      name: Appearance
      icon: "mdi:palette-outline"
      collapsed: true
      input:
        header_title:
          name: Header title
          description: Shown in capitals at the top left. Leave blank for "Sun & Moon" in your language.
          default: ''
          selector:
            text: {}
        time_format:
          name: Time format
          description: 12-hour (AM/PM) or 24-hour clock for the times on the display.
          default: 24h
          selector:
            select:
              options:
              - label: 12-hour (AM/PM)
                value: 12h
              - label: 24-hour
                value: 24h
        weekday_format:
          name: Language
          description: 'Language of the texts on the display: titles, day and month names, messages.'
          default: en
          selector:
            select:
              options:
              - label: English
                value: en
              - label: German
                value: de
              - label: Dutch
                value: nl
              - label: French
                value: fr
              - label: Spanish
                value: es
              - label: Polish
                value: pl
              - label: Croatian
                value: hr
              - label: Swedish
                value: sv
        rotate:
          name: Rotation
          description: 'Display rotation in degrees. This panel is natively portrait (184 x 384): 270 draws this layout upright,
            90 upside down.'
          default: '270'
          selector:
            select:
              options:
              - label: '0'
                value: '0'
              - label: '90'
                value: '90'
              - label: '180'
                value: '180'
              - label: '270'
                value: '270'
    advanced:
      name: Advanced
      icon: "mdi:cog"
      collapsed: true
      input:
        led_color:
          name: LED flash colour
          description: Colour of the confirmation flash when the update was triggered by a device button press.
          default:
          - 0
          - 255
          - 0
          selector:
            color_rgb: {}
        led_flash_delay:
          name: LED flash interval
          description: Time between the confirmation flashes.
          default: 500
          selector:
            number:
              min: 100
              max: 1500
              step: 100
              unit_of_measurement: ms
              mode: slider
        font_dir:
          name: Font folder (optional)
          description: Leave empty when the design-system fonts (TRMNL12/16/21 Regular + Bold and SpaceGrotesk-Bold.ttf) are
            in one of drawcustom's font folders (/config/www/fonts, /config/media/fonts or /media/fonts). Otherwise give an
            absolute folder path ending in a slash, e.g. /config/fonts/
          default: ''
          selector:
            text: {}
variables:
  ds_set: 'ixzsyf'
  font_dir: !input 'font_dir'
  ds_devs: !input 'displays'
  weekday_lang: !input 'weekday_format'
  time_format: !input 'time_format'
  header_title: !input 'header_title'
  hemisphere: !input 'hemisphere'
  moon_azimuth_sensor: !input 'moon_azimuth_sensor'
  moon_altitude_sensor: !input 'moon_altitude_sensor'
  moon_phase_sensor: !input 'moon_phase_sensor'
  language_map: "{%- from 'ep_i18n.jinja' import EP_TXT -%}{{ EP_TXT['sun-moon'] }}"
  moon_phase_entity: '{{ moon_phase_sensor if (moon_phase_sensor | default('''') | trim != '''') else ((integration_entities(''moon'')
    | first) | default(''notfound'')) }}'
  header_title_display: '{{ header_title if header_title else language_map[weekday_lang][''default_title''] }}'
  sun_available: '{{ states(''sun.sun'') not in [''unknown'', ''unavailable''] }}'
  moon_position_available: '{{ (moon_azimuth_sensor | default('''') | trim != '''') and (moon_altitude_sensor | default('''')
    | trim != '''') and states(moon_azimuth_sensor) not in [''unknown'', ''unavailable''] and states(moon_altitude_sensor)
    not in [''unknown'', ''unavailable''] }}'
  moon_phase_available: '{{ states(moon_phase_entity) not in [''unknown'', ''unavailable''] }}'
  moon_icon: |-
    {% set moon_phase = states(moon_phase_entity) %} {% if moon_phase == 'new_moon' %}
      moon-new
    {% elif moon_phase == 'full_moon' %}
      moon-full
    {% else %}
      {{ 'moon-' ~ moon_phase | replace('_', '-') }}
    {% endif %}
  ds_txt: |
    {% set m = {
      "en": {"t": ["Dawn", "Rise", "Noon", "Set", "Dusk"], "c": ["E", "S", "W", "N"], "dl": "Day length"},
      "de": {"t": ["Dämm.", "Auf", "Mittag", "Unter", "Dämm."], "c": ["O", "S", "W", "N"], "dl": "Tageslänge"},
      "nl": {"t": ["Dageraad", "Op", "Middag", "Onder", "Schemer"], "c": ["O", "Z", "W", "N"], "dl": "Daglengte"},
      "fr": {"t": ["Aube", "Lever", "Midi", "Coucher", "Crép."], "c": ["E", "S", "O", "N"], "dl": "Durée du jour"},
      "es": {"t": ["Alba", "Salida", "Mediod.", "Puesta", "Ocaso"], "c": ["E", "S", "O", "N"], "dl": "Duración del día"},
      "pl": {"t": ["Świt", "Wschód", "Połud.", "Zachód", "Zmierzch"], "c": ["W", "P", "Z", "P"], "dl": "Długość dnia"},
      "hr": {"t": ["Zora", "Izlazak", "Podne", "Zalazak", "Sumrak"], "c": ["I", "J", "Z", "S"], "dl": "Duljina dana"},
      "sv": {"t": ["Gryning", "Upp", "Middag", "Ned", "Skymning"], "c": ["Ö", "S", "V", "N"], "dl": "Dagslängd"}
    } %} {{ m[weekday_lang] }}
trigger: !input 'automation_trigger'
conditions: !input 'automation_conditions'
action:
- alias: 'Button feedback: flash the pressed device''s LED'
  if:
  - condition: template
    value_template: |-
      {{ trigger is defined and trigger.entity_id is defined and trigger.entity_id is string
         and trigger.entity_id.startswith('event.') and device_id(trigger.entity_id) is not none }}
  then:
  - action: opendisplay.activate_led
    continue_on_error: true
    data:
      device_id: '{{ device_id(trigger.entity_id) }}'
      color1: !input 'led_color'
      flash_count1: 2
      loop_delay1: !input 'led_flash_delay'
      brightness: 16
      repeats: 1
- choose:
  - conditions:
    - '{{ sun_available }}'
    sequence:
    - action: opendisplay.drawcustom
      target:
        device_id: !input 'displays'
      data:
        background: white
        dither: none
        rotate: !input 'rotate'
        payload: '{%- from ''ep_design.jinja'' import ep_draw -%} {{- (ep_draw | as_function)(''sun_moon_35'', ''main'', {''ds_set'':
          ds_set, ''ds_devs'': ds_devs, ''font_dir'': font_dir, ''ds_txt'': ds_txt, ''header_title_display'': header_title_display,
          ''hemisphere'': hemisphere, ''moon_altitude_sensor'': moon_altitude_sensor, ''moon_azimuth_sensor'': moon_azimuth_sensor,
          ''moon_icon'': moon_icon, ''moon_phase_available'': moon_phase_available, ''moon_phase_sensor'': moon_phase_sensor,
          ''moon_position_available'': moon_position_available, ''time_format'': time_format, ''weekday_lang'': weekday_lang})
          -}}'
  default:
  - action: opendisplay.drawcustom
    target:
      device_id: !input 'displays'
    data:
      background: white
      dither: none
      rotate: !input 'rotate'
      payload: '{%- from ''ep_design.jinja'' import ep_draw -%} {{- (ep_draw | as_function)(''sun_moon_35'', ''error'', {''ds_set'':
        ds_set, ''ds_devs'': ds_devs, ''font_dir'': font_dir, ''header_title_display'': header_title_display, ''language_map'':
        language_map, ''moon_phase_sensor'': moon_phase_sensor, ''time_format'': time_format, ''weekday_lang'': weekday_lang})
        -}}'
mode: single
max_exceeded: silent
